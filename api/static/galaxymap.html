<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>EDGIS:Galaxy Map</title>
    <link rel="stylesheet" href="/static/ed3d/main.css">
    <link rel="stylesheet" href="/static/ed3d/styles.css">
    <style>
     html, body {
       height: 100%;
       margin: 0;
       padding: 0;
     }
     .container {
       height: 100%;
       width: 100%;
     }
     #edmap {
       height: 100%;
       width: 100%;
       position: relative; /* needed for z-index stacking context */
     }

     /* Sidebar Toolbar */
     .toolbar {
       position: fixed;
       top: 0;
       right: 0;
       width: 60px;
       height: 100%;
       background: rgba(15,15,15,0);
       display: flex;
       flex-direction: column;
       align-items: center;
       padding: 10px 0;
       z-index: 1000;
     }

     #edgisbanner {
       position: absolute;
       bottom: 0rem;
       left: 0;
       width: 250px;
       background-color: rgba(0,0,0,0.7);
       color: white;
       text-align: center;
       z-index: 1000;
       font-size: larger;
     }

     .toolbar button {
       width: 45px;
       height: 45px;
       margin: 8px 0;
       background: #3a2109;
       border: 0px solid #444;
       color: #fa6d00;
       font-size: 18px;
       cursor: pointer;
       transition: background 0.2s;
     }

     .toolbar button {
       background: #3a2109;
       color: #fa6d00;
       transition: background 0.2s, color 0.3s;
     }

     .toolbar button:hover {
       background: #fa6d00;
       color: #3a2109;
     }

     .toolbar button svg {
       transition: fill 0.3s;
       fill: currentColor;
     }

     .info-panel {
       position: fixed;
       top: 20px;
       right: 80px; /* leaves space for toolbar */
       background: black;
       color: white;
       padding: 15px;
       z-index: 999;
       overflow: hidden; /* ensures glow doesn't spill too much */
       border-top: 2px solid transparent; /* invisible by default */
       transition: border-color 0.3s ease;
     }

     .info-panel h2 {
       color: #fa6d00;
       font-size: 1.2rem;
       margin: 10px 0;
       border-bottom: 1px solid #333;
     }

     .info-panel p {
       margin: 4px 0;
       font-size: 14px;
     }

     .info-panel:hover {
       border-color: orange; /* top border appears */
     }

     /* Pseudo-elements for top & bottom glow */
     .info-panel::before,
     .info-panel::after {
       content: "";
       position: absolute;
       left: 50%;
       transform: translateX(-50%);
       width: 400px;  /* larger for softer spread */
       height: 300px;
       border-radius: 50%;
       background: radial-gradient(
         circle,
         rgba(250, 109, 0, 0.25) 0%,   /* softer orange */
         rgba(250, 109, 0, 0.15) 30%,  /* gentle fade */
         rgba(250, 109, 0, 0.05) 60%,
         rgba(250, 109, 0, 0) 100%
       );
       opacity: 0;
       transition: opacity 0.3s ease;
       pointer-events: none; /* don't block clicks */
       z-index: -1; /* stay behind content */
     }

     .info-panel::before {
       top: -150px; /* sits above */
     }

     .info-panel::after {
       bottom: -150px; /* sits below */
     }

     .info-panel:hover::before,
     .info-panel:hover::after {
       opacity: 1;
     }

     .label {
       color: #aaa;
       font-size: 1.1rem;
     }

     a {
       color: #fa6d00;
       text-decoration: none;
       transition: text-shadow 0.3s, color 0.3s; /* smooth transition */
     }

     a:hover {
       text-shadow: 0 0 5px #fa6d00, 0 0 10px #fa6d00, 0 0 15px #ff9500;
     }

     li {
       display: flex;
       justify-content: space-between;
       margin: 0.25rem 0;
     }

     li .label {
       font-weight: bold;
     }

     @font-face {
       font-family: 'Euro Caps';
       src: url('/static/assets/EUROCAPS.TTF') format('truetype');
       font-weight: normal;
       font-style: normal;
     }
     body {
       font-family: 'Euro Caps', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
     }

     h1 { margin: 0 0 .25rem; font-size: 1.6rem; }
     .sub { color: #666; margin: 0 0 1rem; }
     .pill { display: inline-block; padding: .2rem .55rem; border: 1px solid #ccc; border-radius: 999px; font-size: .85rem; margin-right: .4rem; }
     section { margin-top: 1rem; }
     h2 { font-size: 1.5rem; margin: 0 0 .5rem; color: #333; }
     ul { list-style: none; padding: 0; margin: 0; }
     li { margin: .25rem 0; }
     b { color: #aaa; }
     .muted { color: #666; }

     /* Mobile: Half-height & scrollable info panel */
     @media (max-width: 768px) {
       .info-panel {
         /* Set height to ~half the screen */
         height: 25vh;
         max-height: 25vh;

         /* Enable vertical scrolling only when needed */
         overflow-y: auto;

         /* Optional: smooth scroll */
         scroll-behavior: smooth;

         /* Slightly reduce padding for compactness */
         padding: 12px;

         /* Keep it readable but compact */
         font-size: 0.95em;
         /* allow touches to pass through to 3D canvas */
         pointer-events: none; /* Blocks all events (click/touch) */
       }

       /* Re-enable pointer events only on the panel's *children* */
       .info-panel > * {
         pointer-events: auto; /* So text, links, buttons still work */
       }

       /* Optional: style the scrollbar (subtle) */
       .info-panel::-webkit-scrollbar {
         width: 6px;
       }

       .info-panel::-webkit-scrollbar-track {
         background: rgba(0,0,0,0.1);
         border-radius: 3px;
       }

       .info-panel::-webkit-scrollbar-thumb {
         background: rgba(250, 109, 0, 0.3);
         border-radius: 3px;
       }

       .info-panel::-webkit-scrollbar-thumb:hover {
         background: rgba(250, 109, 0, 0.5);
       }

       /* Also reduce banner size to free up space */
       #edgisbanner {
         font-size: small;
         width: 180px;
         padding: 4px 0;
       }
     }

     @media (max-height: 480px) {
       .info-panel {
         /* Set height to ~half the screen */
         height: 42vh;
         max-height: 42vh;

         width: 25vw;
         max-width: 25vw;
         /* Enable vertical scrolling only when needed */
         overflow-y: auto;

         /* Optional: smooth scroll */
         scroll-behavior: smooth;

         /* Slightly reduce padding for compactness */
         padding: 12px;

         /* Keep it readable but compact */
         font-size: 0.95em;
       }

       /* Optional: style the scrollbar (subtle) */
       .info-panel::-webkit-scrollbar {
         width: 6px;
       }

       .info-panel::-webkit-scrollbar-track {
         background: rgba(0,0,0,0.1);
         border-radius: 3px;
       }

       .info-panel::-webkit-scrollbar-thumb {
         background: rgba(250, 109, 0, 0.3);
         border-radius: 3px;
       }

       .info-panel::-webkit-scrollbar-thumb:hover {
         background: rgba(250, 109, 0, 0.5);
       }

       /* Also reduce banner size to free up space */
       #edgisbanner {
         font-size: small;
         width: 180px;
         padding: 4px 0;
       }
     }
    </style>
  </head>
  <body>
    <div id="edgisbanner">
      <a target="_blank"
         href="/"
         style="color: white; text-decoration: none;">
        <span>[EDGIS]</span>
      </a>
      <a id="edgis" target="_blank"
         href="/neighbors?x=0&y=0&z=0&radius=10"
         style="color: white; text-decoration: none;">
        <span>[JSON data]</span>
      </a>
    </div>
    <div class="container">
      <div id="edmap"></div>
    </div>

    <!-- Info Panel -->
    <div class="info-panel" id="InfoPanel" style="display:none">
    </div>
