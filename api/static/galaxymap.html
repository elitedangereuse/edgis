<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>EDGIS:Galaxy Map</title>
    <link rel="stylesheet" href="/static/ed3d/main.css">
    <link rel="stylesheet" href="/static/ed3d/styles.css">
    <style>
     html, body {
       height: 100%;
       margin: 0;
       padding: 0;
     }
     .container {
       height: 100%;
       width: 100%;
     }
     #edmap {
       height: 100%;
       width: 100%;
       position: relative; /* needed for z-index stacking context */
     }

     /* Sidebar Toolbar */
     .toolbar {
       position: fixed;
       top: 0;
       right: 0;
       width: 60px;
       height: 100%;
       background: rgba(15,15,15,0);
       display: flex;
       flex-direction: column;
       align-items: center;
       padding: 10px 0;
       z-index: 1000;
     }

     .left-toolbar {
       position: fixed;
       top: 0;
       left: 0;
       width: 60px;
       height: 100%;
       background: rgba(15,15,15,0);
       display: flex;
       flex-direction: column;
       align-items: center;
       padding: 10px 0;
       z-index: 1000;
     }

     @keyframes toolbar-home-refresh {
       0% {
         box-shadow: 0 0 0 rgba(250, 109, 0, 0);

       }
       50% {
         box-shadow: 0 0 18px rgba(250, 109, 0, 0.45);

       }
       100% {
         box-shadow: 0 0 0 rgba(250, 109, 0, 0)

       }
     }

     @keyframes toolbar-home-logo-refresh {
       0% {
         transform: scale(1);
         filter: brightness(1);
       }
       50% {
         transform: scale(1.12);
         filter: brightness(1.35) drop-shadow(0 0 8px rgba(250, 109, 0, 0.75));
       }
       100% {
         transform: scale(1);
         filter: brightness(1);
       }
     }

     #openEdgisButton.is-loading {
       animation: toolbar-home-refresh 0.9s ease-in-out infinite;
     }

     #openEdgisButton.is-loading svg {
       animation: toolbar-home-logo-refresh 0.9s ease-in-out infinite;
     }

     #edgisbanner {
       position: absolute;
       bottom: 0rem;
       left: 0;
       width: 250px;
       background-color: rgba(0,0,0,0.7);
       color: white;
       text-align: center;
       z-index: 1000;
       font-size: larger;
     }

     .toolbar button,
     .left-toolbar button {
       width: 45px;
       height: 45px;
       margin: 8px 0;
       background: #3a2109;
       border: 0px solid #444;
       color: #fa6d00;
       font-size: 18px;
       cursor: pointer;
       transition: background 0.2s;
     }

     .toolbar button,
     .left-toolbar button {
       background: #3a2109;
       color: #fa6d00;
       transition: background 0.2s, color 0.3s;
     }

     .toolbar button:hover,
     .left-toolbar button:hover {
       background: #fa6d00;
       color: #3a2109;
     }

     .toolbar button.is-active,
     .left-toolbar button.is-active {
       background: #fa6d00;
       color: #3a2109;
     }

     .toolbar button svg,
     .left-toolbar button svg {
       transition: fill 0.3s;
       fill: currentColor;
     }

     .left-toolbar .filter-dimension-icon {
       width: 20px;
       height: 20px;
       display: block;
       margin: 0 auto;
     }

     .radius-display-corner {
       position: fixed;
       right: 10px;
       bottom: 10px;
       z-index: 1000;
       color: #fa6d00;
       font-size: 0.82rem;
       letter-spacing: 0.06em;
       user-select: none;
       pointer-events: none;
     }

     .map-status-corner {
       position: fixed;
       right: 10px;
       bottom: 28px;
       z-index: 1000;
       color: #fa6d00;
       font-size: 0.8rem;
       letter-spacing: 0.06em;
       text-align: right;
       user-select: none;
       pointer-events: none;
       line-height: 1.35;
     }

     .controls-panel {
       position: fixed;
       top: 16px;
       right: 72px;
       background: rgba(0, 0, 0, 0.82);
       border: 1px solid rgba(255,255,255,0.12);
       border-radius: 14px;
       padding: 10px 14px;
       box-shadow: 0 12px 40px rgba(0,0,0,0.5);
       backdrop-filter: blur(8px);
       z-index: 1100;
     }

     .controls-panel label {
       font-size: 0.9rem;
       text-transform: uppercase;
       letter-spacing: 0.08em;
       color: #9aa3c7;
     }

     .form-grid {
       display: grid;
       grid-template-columns: max-content minmax(160px, 280px) max-content;
       gap: 0.5rem;
       align-items: center;
     }

     .form-grid input,
     .form-grid button {
       padding: 0.5rem 0.75rem;
       font-size: 1rem;
       line-height: 1.2;
       box-sizing: border-box;
     }

     .form-grid input {
       background: #161616;
       color: #e6e9ff;
       border: 1px solid rgba(255,255,255,0.18);
     }

     .form-grid button {
       border: 1px solid rgba(255,255,255,0.18);
       background: #3a2109;
       color: #fa6d00;
       cursor: pointer;
       white-space: nowrap;
     }

     .form-grid button:hover {
       background: #fa6d00;
       color: #3a2109;
     }

     .settings-panel {
       position: fixed;
       top: 84px;
       right: 72px;
       width: 280px;
       background: rgba(0, 0, 0, 0.82);
       border: 1px solid rgba(255,255,255,0.12);
       border-radius: 14px;
       padding: 12px 14px;
       box-shadow: 0 12px 40px rgba(0,0,0,0.5);
       backdrop-filter: blur(8px);
       z-index: 1100;
       color: #e6e9ff;
     }

     .settings-panel h3 {
       margin: 0 0 10px 0;
       color: #fa6d00;
       font-size: 1rem;
       letter-spacing: 0.08em;
       text-transform: uppercase;
     }

     .settings-row {
       display: grid;
       grid-template-columns: 1fr auto;
       align-items: center;
       gap: 8px;
       margin-bottom: 8px;
     }

     .settings-row label {
       font-size: 0.82rem;
       text-transform: uppercase;
       letter-spacing: 0.08em;
       color: #9aa3c7;
     }

     .settings-row output {
       font-size: 0.82rem;
       color: #fa6d00;
       min-width: 52px;
       text-align: right;
     }

     .settings-panel input[type="range"] {
       width: 100%;
       margin: 2px 0 10px 0;
       accent-color: #fa6d00;
     }

     .settings-checkbox-row {
       margin-top: 8px;
       margin-bottom: 10px;
     }

     .settings-checkbox-row label {
       cursor: pointer;
     }

     .settings-checkbox-row input[type="checkbox"] {
       width: 16px;
       height: 16px;
       margin: 0;
       accent-color: #fa6d00;
       cursor: pointer;
     }

     .settings-note {
       margin: 2px 0 0 0;
       color: #9aa3c7;
       font-size: 0.74rem;
       line-height: 1.35;
       letter-spacing: 0.03em;
     }

     .settings-actions {
       display: flex;
       justify-content: flex-end;
       margin-top: 10px;
     }

     .settings-actions button {
       border: 1px solid rgba(255,255,255,0.18);
       background: #3a2109;
       color: #fa6d00;
       padding: 0.42rem 0.72rem;
       cursor: pointer;
       font-size: 0.8rem;
       text-transform: uppercase;
       letter-spacing: 0.08em;
     }

     .settings-actions button:hover {
       background: #fa6d00;
       color: #3a2109;
     }

     #hud {
       position: fixed !important;
       top: 16px !important;
       left: 72px !important;
       width: 280px !important;
       height: calc(100% - 32px) !important;
       max-height: calc(100% - 32px) !important;
       overflow-y: auto !important;
       padding: 12px 14px !important;
       background: rgba(0, 0, 0, 0.82) !important;
       border: 1px solid rgba(255,255,255,0.12) !important;
       border-radius: 14px !important;
       box-shadow: 0 12px 40px rgba(0,0,0,0.5) !important;
       backdrop-filter: blur(8px) !important;
       color: #e6e9ff !important;
       z-index: 1100 !important;
       box-sizing: border-box !important;
       transition: opacity 0.18s ease, transform 0.18s ease !important;
     }

     #hud.is-collapsed {
       opacity: 0 !important;
       pointer-events: none !important;
       transform: translateX(-10px) !important;
     }

     #hud #hud-infos {
       display: none !important;
     }

     #hud h2 {
       margin: 0 0 10px 0 !important;
       color: #fa6d00 !important;
       font-size: 1rem !important;
       letter-spacing: 0.08em !important;
       text-transform: uppercase !important;
       border-bottom: 1px solid rgba(255,255,255,0.12) !important;
       text-shadow: none !important;
     }

     #hud > div {
       margin-bottom: 12px !important;
     }

     #hud .coords {
       padding-bottom: 8px !important;
       margin-bottom: 10px !important;
       border-bottom: 1px solid rgba(255,255,255,0.12) !important;
     }

     #hud .coords > span {
       background: #161616 !important;
       color: #e6e9ff !important;
       border: 1px solid rgba(255,255,255,0.18) !important;
       box-shadow: none !important;
       font-size: 0.86rem !important;
       padding: 6px 0 !important;
     }

     #hud .map_filter,
     #hud .map_link {
       color: #e6e9ff !important;
     }

     #hud .map_filter:hover,
     #hud .map_link:hover {
       color: #fa6d00 !important;
     }

     #hud .map_filter.disabled {
       opacity: 0.55;
     }

     #hud .map_filter .check {
       float: right;
       margin-left: 8px;
     }

     #hud .map_filter .check:after {
       background: rgba(0,0,0,0.45) !important;
       border: 1px solid rgba(255,255,255,0.15);
       box-sizing: border-box;
     }

     #hud #filters > h8 {
       display: block !important;
       margin: 0 0 10px 0 !important;
       color: #fa6d00 !important;
       font-size: 1rem !important;
       font-weight: 700 !important;
       letter-spacing: 0.12em !important;
       text-transform: uppercase !important;
     }

     #hud .hud-filter-actions {
       display: flex;
       gap: 6px;
       margin: 0 0 10px 0;
     }

     #hud .hud-filter-actions button {
       appearance: none;
       border: 1px solid rgba(255,255,255,0.18);
       background: rgba(58, 33, 9, 0.32);
       color: #e6e9ff;
       font-size: 0.72rem;
       letter-spacing: 0.08em;
       text-transform: uppercase;
       padding: 4px 7px;
       cursor: pointer;
       line-height: 1.2;
     }

     #hud .hud-filter-actions button:hover {
       border-color: rgba(250, 109, 0, 0.55);
       color: #fa6d00;
     }

     .info-panel {
       position: fixed;
       top: 20px;
       right: 80px; /* leaves space for toolbar */
       background: black;
       color: white;
       padding: 15px;
       z-index: 999;
       overflow: hidden; /* ensures glow doesn't spill too much */
       border-top: 2px solid transparent; /* invisible by default */
       transition: border-color 0.3s ease;
     }

     .info-panel h2 {
       color: #fa6d00;
       font-size: 1.2rem;
       margin: 10px 0;
       border-bottom: 1px solid #333;
     }

     .info-panel p {
       margin: 4px 0;
       font-size: 14px;
     }

     .info-panel:hover {
       border-color: orange; /* top border appears */
     }

     /* Pseudo-elements for top & bottom glow */
     .info-panel::before,
     .info-panel::after {
       content: "";
       position: absolute;
       left: 50%;
       transform: translateX(-50%);
       width: 400px;  /* larger for softer spread */
       height: 300px;
       border-radius: 50%;
       background: radial-gradient(
         circle,
         rgba(250, 109, 0, 0.25) 0%,   /* softer orange */
         rgba(250, 109, 0, 0.15) 30%,  /* gentle fade */
         rgba(250, 109, 0, 0.05) 60%,
         rgba(250, 109, 0, 0) 100%
       );
       opacity: 0;
       transition: opacity 0.3s ease;
       pointer-events: none; /* don't block clicks */
       z-index: -1; /* stay behind content */
     }

     .info-panel::before {
       top: -150px; /* sits above */
     }

     .info-panel::after {
       bottom: -150px; /* sits below */
     }

     .info-panel:hover::before,
     .info-panel:hover::after {
       opacity: 1;
     }

     .label {
       color: #aaa;
       font-size: 1.1rem;
     }

     a {
       color: #fa6d00;
       text-decoration: none;
       transition: text-shadow 0.3s, color 0.3s; /* smooth transition */
     }

     a:hover {
       text-shadow: 0 0 5px #fa6d00, 0 0 10px #fa6d00, 0 0 15px #ff9500;
     }

     li {
       display: flex;
       justify-content: space-between;
       margin: 0.25rem 0;
     }

     li .label {
       font-weight: bold;
     }

     @font-face {
       font-family: 'Euro Caps';
       src: url('/static/assets/EUROCAPS.TTF') format('truetype');
       font-weight: normal;
       font-style: normal;
     }
     body {
       font-family: 'Euro Caps', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
     }

     h1 { margin: 0 0 .25rem; font-size: 1.6rem; }
     .sub { color: #666; margin: 0 0 1rem; }
     .pill { display: inline-block; padding: .2rem .55rem; border: 1px solid #ccc; border-radius: 999px; font-size: .85rem; margin-right: .4rem; }
     section { margin-top: 1rem; }
     h2 { font-size: 1.5rem; margin: 0 0 .5rem; color: #333; }
     ul { list-style: none; padding: 0; margin: 0; }
     li { margin: .25rem 0; }
     b { color: #aaa; }
     .muted { color: #666; }

     /* Mobile: Half-height & scrollable info panel */
     @media (max-width: 768px) {
       .radius-display-corner {
         font-size: 0.74rem;
       }

       #hud {
         width: calc(100% - 150px) !important;
         min-width: 180px !important;
         max-width: 360px !important;
         left: 72px !important;
         top: 16px !important;
         height: auto !important;
         max-height: calc(100% - 32px) !important;
       }

       .controls-panel {
         right: 72px;
         left: auto;
         width: calc(100% - 150px);
         min-width: 180px;
         max-width: 360px;
       }

       .settings-panel {
         right: 72px;
         left: auto;
         width: calc(100% - 150px);
         min-width: 180px;
         max-width: 360px;
       }

       .form-grid {
         grid-template-columns: 1fr;
       }

       .form-grid button {
         width: 100%;
       }

       .info-panel {
         /* Set height to ~half the screen */
         height: 25vh;
         max-height: 25vh;

         /* Enable vertical scrolling only when needed */
         overflow-y: auto;

         /* Optional: smooth scroll */
         scroll-behavior: smooth;

         /* Slightly reduce padding for compactness */
         padding: 12px;

         /* Keep it readable but compact */
         font-size: 0.95em;
         /* allow touches to pass through to 3D canvas */
         pointer-events: none; /* Blocks all events (click/touch) */
       }

       /* Re-enable pointer events only on the panel's *children* */
       .info-panel > * {
         pointer-events: auto; /* So text, links, buttons still work */
       }

       /* Optional: style the scrollbar (subtle) */
       .info-panel::-webkit-scrollbar {
         width: 6px;
       }

       .info-panel::-webkit-scrollbar-track {
         background: rgba(0,0,0,0.1);
         border-radius: 3px;
       }

       .info-panel::-webkit-scrollbar-thumb {
         background: rgba(250, 109, 0, 0.3);
         border-radius: 3px;
       }

       .info-panel::-webkit-scrollbar-thumb:hover {
         background: rgba(250, 109, 0, 0.5);
       }

       /* Also reduce banner size to free up space */
       #edgisbanner {
         font-size: small;
         width: 180px;
         padding: 4px 0;
       }
     }

     @media (max-height: 480px) {
       .info-panel {
         /* Set height to ~half the screen */
         height: 42vh;
         max-height: 42vh;

         width: 25vw;
         max-width: 25vw;
         /* Enable vertical scrolling only when needed */
         overflow-y: auto;

         /* Optional: smooth scroll */
         scroll-behavior: smooth;

         /* Slightly reduce padding for compactness */
         padding: 12px;

         /* Keep it readable but compact */
         font-size: 0.95em;
       }

       /* Optional: style the scrollbar (subtle) */
       .info-panel::-webkit-scrollbar {
         width: 6px;
       }

       .info-panel::-webkit-scrollbar-track {
         background: rgba(0,0,0,0.1);
         border-radius: 3px;
       }

       .info-panel::-webkit-scrollbar-thumb {
         background: rgba(250, 109, 0, 0.3);
         border-radius: 3px;
       }

       .info-panel::-webkit-scrollbar-thumb:hover {
         background: rgba(250, 109, 0, 0.5);
       }

       /* Also reduce banner size to free up space */
       #edgisbanner {
         font-size: small;
         width: 180px;
         padding: 4px 0;
       }
     }
    </style>
  </head>
  <body>
    <div class="controls-panel" id="controlsPanel" style="display:none">
      <div class="form-grid">
        <label for="system">System</label>
        <input id="system" value="" list="systemSuggestions">
        <datalist id="systemSuggestions"></datalist>
        <button id="load" aria-label="Render">
          <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M5 5v14l7-5.5V19h3V5h-3v5.5z" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="settings-panel" id="settingsPanel" style="display:none">
      <h3>Star Settings</h3>
      <div class="settings-row">
        <label for="starSizeRange">Size</label>
        <output id="starSizeValue" for="starSizeRange">100%</output>
      </div>
      <input id="starSizeRange" type="range" min="1" max="1000" step="1" value="100">
      <div class="settings-row">
        <label for="starBrightnessRange">Brightness</label>
        <output id="starBrightnessValue" for="starBrightnessRange">100%</output>
      </div>
      <input id="starBrightnessRange" type="range" min="1" max="100" step="1" value="100">
      <div class="settings-row">
        <label for="starOpacityRange">Opacity</label>
        <output id="starOpacityValue" for="starOpacityRange">100%</output>
      </div>
      <input id="starOpacityRange" type="range" min="1" max="100" step="1" value="100">
      <p class="settings-note">Adaptive baseline comes from local star density and radius. Sliders are saved as multipliers.</p>
      <div class="settings-row settings-checkbox-row">
        <label for="expertModeToggle">Expert Mode</label>
        <input id="expertModeToggle" type="checkbox" aria-label="Expert Mode">
      </div>
      <div class="settings-actions">
        <button id="resetStarSettingsButton" type="button">Reset</button>
      </div>
    </div>
    <div id="edgisbanner">
      <a target="_blank"
         href="/"
         style="color: white; text-decoration: none;">
        <span>[EDGIS]</span>
      </a>
      <a id="edgis" target="_blank"
         href="/neighbors?x=0&y=0&z=0&radius=10"
         style="color: white; text-decoration: none;">
        <span>[JSON data]</span>
      </a>
    </div>
    <div class="container">
      <div id="edmap"></div>
    </div>
    <div class="left-toolbar">
      <button title="Spectral Filters" id="filterDimensionSpectralButton" aria-label="Spectral Filters">
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi bi-stars filter-dimension-icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M7.657 6.247c.11-.33.576-.33.686 0l.645 1.937a2.89 2.89 0 0 0 1.829 1.828l1.936.645c.33.11.33.576 0 .686l-1.937.645a2.89 2.89 0 0 0-1.828 1.829l-.645 1.936a.361.361 0 0 1-.686 0l-.645-1.937a2.89 2.89 0 0 0-1.828-1.828l-1.937-.645a.361.361 0 0 1 0-.686l1.937-.645a2.89 2.89 0 0 0 1.828-1.828zM3.794 1.148a.217.217 0 0 1 .412 0l.387 1.162c.173.518.579.924 1.097 1.097l1.162.387a.217.217 0 0 1 0 .412l-1.162.387A1.73 1.73 0 0 0 4.593 5.69l-.387 1.162a.217.217 0 0 1-.412 0L3.407 5.69A1.73 1.73 0 0 0 2.31 4.593l-1.162-.387a.217.217 0 0 1 0-.412l1.162-.387A1.73 1.73 0 0 0 3.407 2.31zM10.863.099a.145.145 0 0 1 .274 0l.258.774c.115.346.386.617.732.732l.774.258a.145.145 0 0 1 0 .274l-.774.258a1.16 1.16 0 0 0-.732.732l-.258.774a.145.145 0 0 1-.274 0l-.258-.774a1.16 1.16 0 0 0-.732-.732L9.1 2.137a.145.145 0 0 1 0-.274l.774-.258c.346-.115.617-.386.732-.732z"/>
        </svg>
      </button>
      <button title="Atmosphere Filters" id="filterDimensionAtmosphereButton" aria-label="Atmosphere Filters">
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi bi-cloud filter-dimension-icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M4.406 3.342A5.53 5.53 0 0 1 8 2c2.69 0 4.923 2 5.166 4.579C14.758 6.804 16 8.137 16 9.773 16 11.569 14.502 13 12.687 13H3.781C1.708 13 0 11.366 0 9.318c0-1.763 1.266-3.223 2.942-3.593.143-.863.698-1.723 1.464-2.383m.653.757c-.757.653-1.153 1.44-1.153 2.056v.448l-.445.049C2.064 6.805 1 7.952 1 9.318 1 10.785 2.23 12 3.781 12h8.906C13.98 12 15 10.988 15 9.773c0-1.216-1.02-2.228-2.313-2.228h-.5v-.5C12.188 4.825 10.328 3 8 3a4.53 4.53 0 0 0-2.941 1.1z"/>
        </svg>
      </button>
