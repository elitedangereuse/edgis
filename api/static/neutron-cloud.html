<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EDGIS · Neutron point cloud (spike)</title>
<style>
  :root { --ink:#e5e7eb; --muted:#8b97a7; --accent:#80c4e6; }
  html,body { margin:0; height:100%; background:#05080d; color:var(--ink);
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; overflow:hidden; }
  #gl { position:fixed; inset:0; display:block; }
  #hud { position:fixed; top:12px; left:12px; font-size:12px; line-height:1.5;
    background:rgba(5,8,13,.55); border:1px solid rgba(255,255,255,.1);
    border-radius:8px; padding:9px 12px; pointer-events:none; backdrop-filter:blur(4px); }
  #hud b { color:var(--accent); font-weight:600; }
  #hud .muted { color:var(--muted); }
  /* pointer-events:none so the overlay never blocks the canvas controls, and an
     explicit [hidden] rule: the author display:flex would otherwise OVERRIDE the
     UA's [hidden]{display:none}, leaving "Loading…" stuck on screen forever. */
  #load { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:14px; color:var(--muted); pointer-events:none; }
  #load[hidden] { display:none; }
  #help { position:fixed; bottom:12px; left:12px; font-size:11px; color:var(--muted); }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud" hidden>
  <div><b id="hCount">—</b> neutron stars <span class="muted">(1 draw call)</span></div>
  <div class="muted"><span id="hBytes">—</span> · load <span id="hLoad">—</span> · decode <span id="hDecode">—</span></div>
  <div class="muted"><span id="hFps">—</span> fps</div>
</div>
<div id="load">Loading neutron field…</div>
<div id="help">drag to orbit · scroll to zoom · right-drag to pan</div>

<script src="/static/ed3d/vendor/three-js/three.min.js"></script>
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const DATA = "/static/data/";

  // ---- fetch meta (small) to size buffers + frame the camera up front ------
  const tLoad0 = performance.now();
  let meta;
  try {
    meta = await (await fetch(DATA + "neutrons.meta.json", { cache: "force-cache" })).json();
  } catch (e) {
    $("load").textContent = "Could not load the neutron cloud (run build_neutron_cloud.py first).";
    return;
  }
  const n = meta.count | 0;

  // ---- THREE scene ---------------------------------------------------------
  const canvas = $("gl");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: "high-performance" });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05080d);
  const camera = new THREE.PerspectiveCamera(55, 1, 1, 400000);

  // Preallocate the full position buffer once; the worker streams decoded
  // batches into it and we grow the draw range so points appear as they load.
  const pos = new Float32Array(n * 3);
  const geom = new THREE.BufferGeometry();
  const posAttr = new THREE.BufferAttribute(pos, 3);
  posAttr.setUsage(THREE.DynamicDrawUsage);
  geom.setAttribute("position", posAttr);
  geom.setDrawRange(0, 0);
  // Constant screen-space point size (sizeAttenuation off) so the field stays
  // crisp and visible at galaxy-overview distance; additive blending makes the
  // dense disk glow where points overlap.
  const mat = new THREE.PointsMaterial({
    color: 0x9fe0ff, size: 1.6, sizeAttenuation: false,
    transparent: true, opacity: 0.8, depthWrite: false,
    blending: THREE.AdditiveBlending,
  });
  scene.add(new THREE.Points(geom, mat));

  // Sol marker (origin) for orientation.
  const sol = new THREE.Points(
    (() => { const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.BufferAttribute(new Float32Array([0, 0, 0]), 3)); return g; })(),
    new THREE.PointsMaterial({ color: 0xffd36b, size: 7, sizeAttenuation: false }));
  scene.add(sol);

  // ---- frame the camera from meta.bbox (known before any point arrives) ----
  const bmin = meta.bbox.min, bmax = meta.bbox.max;
  const target = new THREE.Vector3(
    (bmin[0] + bmax[0]) / 2, (bmin[1] + bmax[1]) / 2, (bmin[2] + bmax[2]) / 2);
  const diag = Math.hypot(bmax[0] - bmin[0], bmax[1] - bmin[1], bmax[2] - bmin[2]);
  let radius = diag * 0.6;         // orbit distance
  let theta = 0.6, phi = 1.15;     // spherical angles
  const panOff = new THREE.Vector3();
  function applyCamera() {
    const c = target.clone().add(panOff);
    camera.position.set(
      c.x + radius * Math.sin(phi) * Math.cos(theta),
      c.y + radius * Math.cos(phi),
      c.z + radius * Math.sin(phi) * Math.sin(theta));
    camera.lookAt(c);
  }

  // ---- minimal orbit / dolly / pan controls (no external dep) --------------
  let drag = null;
  canvas.addEventListener("mousedown", (e) => { drag = { x: e.clientX, y: e.clientY, b: e.button }; e.preventDefault(); });
  window.addEventListener("mouseup", () => { drag = null; });
  window.addEventListener("mousemove", (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    if (drag.b === 2) {                       // right-drag = pan
      const k = radius * 0.0015;
      const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
      const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
      panOff.addScaledVector(right, -dx * k).addScaledVector(up, dy * k);
    } else {                                  // left-drag = orbit
      theta -= dx * 0.005;
      phi = Math.max(0.05, Math.min(Math.PI - 0.05, phi - dy * 0.005));
    }
  });
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  canvas.addEventListener("wheel", (e) => {
    radius *= Math.exp(e.deltaY * 0.0008);
    radius = Math.max(30, Math.min(300000, radius));
    e.preventDefault();
  }, { passive: false });

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  window.addEventListener("resize", resize); resize();

  // ---- stream + decode in a Web Worker; append batches as they arrive ------
  $("load").hidden = true; $("hud").hidden = false;
  $("hCount").textContent = "0 / " + n.toLocaleString();

  let filled = 0;          // floats written into `pos`
  let bytesDown = 0;
  const totalBytes = meta.bytes || 0;
  const worker = new Worker("/static/neutron-cloud-worker.js");
  worker.onmessage = (e) => {
    const m = e.data;
    if (m.type === "batch") {
      const b = m.positions;
      const room = Math.min(b.length, pos.length - filled);
      if (room > 0) {
        pos.set(room === b.length ? b : b.subarray(0, room), filled);
        // Upload only the newly written span. If a previous span is still
        // pending (two batches between frames; three.js keeps ONE updateRange
        // and count resets to -1 after upload), extend it -- batches are
        // contiguous, so the merge is just a wider span. Overwriting instead
        // would silently drop the first span = permanent holes in the cloud.
        const ur = posAttr.updateRange;
        if (ur.count === -1) {
          ur.offset = filled; ur.count = room;
        } else {
          ur.count = (filled + room) - ur.offset;
        }
        posAttr.needsUpdate = true;
        filled += room;
        geom.setDrawRange(0, filled / 3);
      }
    } else if (m.type === "progress") {
      bytesDown = m.bytes;
      $("hCount").textContent = (filled / 3 | 0).toLocaleString() + " / " + n.toLocaleString();
      $("hBytes").textContent = (bytesDown / 1e6).toFixed(1)
        + (totalBytes ? " / " + (totalBytes / 1e6).toFixed(1) : "") + " MB";
    } else if (m.type === "done") {
      geom.computeBoundingSphere();
      $("hCount").textContent = (filled / 3).toLocaleString() + " neutron stars";
      $("hLoad").textContent = ((performance.now() - tLoad0) / 1000).toFixed(2) + " s";
      $("hDecode").textContent = "streamed";
      worker.terminate();
    } else if (m.type === "error") {
      $("load").hidden = false;
      $("load").textContent = "Neutron stream failed: " + m.message;
    }
  };
  // Prefer the gzipped dump (streamed-gunzipped in the worker) when it exists;
  // fall back to the raw .bin (e.g. right after a rebuild that didn't gzip).
  (async () => {
    let url = DATA + "neutrons.i16.bin";
    try {
      const h = await fetch(DATA + "neutrons.i16.bin.gz", { method: "HEAD", cache: "no-store" });
      if (h.ok) url = DATA + "neutrons.i16.bin.gz";
    } catch (e) { /* no .gz -> use .bin */ }
    worker.postMessage({ url, scale: meta.scale, batchPoints: 150000 });
  })();

  // ---- render loop (runs from frame 1 so the field builds up on screen) ----
  let frames = 0, fpsT = performance.now();
  (function loop() {
    applyCamera();
    renderer.render(scene, camera);
    frames++;
    const now = performance.now();
    if (now - fpsT >= 500) { $("hFps").textContent = Math.round(frames * 1000 / (now - fpsT)); frames = 0; fpsT = now; }
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
