<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <meta http-equiv="X-Frame-Options" content="ALLOWALL">
    <meta http-equiv="Content-Security-Policy" content="frame-ancestors *;">
    <title>EDGIS:System Map</title>
    <link rel="stylesheet" href="sysmap.css">
    <style>
      html[data-svg-only="true"] body {
        margin: 0;
      }
      html[data-svg-only="true"] .controls-panel,
      html[data-svg-only="true"] .toolbar,
      html[data-svg-only="true"] .embed-panel,
      html[data-svg-only="true"] #InfoPanel,
      html[data-svg-only="true"] footer {
        display: none !important;
      }
      html[data-svg-only="true"] #stage {
        box-shadow: none;
        padding: 0;
        background: transparent;
      }
      html[data-svg-only="true"] #svg {
        width: auto !important;
        height: auto !important;
      }
    </style>
    <script>
      (function () {
        const parseBoolQueryParam = (value) => {
          if (value === null || value === undefined) {
            return false;
          }
          if (typeof value === 'boolean') {
            return value;
          }
          const normalized = String(value).trim().toLowerCase();
          if (!normalized) {
            return false;
          }
          return ['1', 'true', 'yes', 'on'].includes(normalized);
        };

        const escapeRegexComponent = (value) => {
          const specials = new Set(['.', '*', '+', '?', '^', '$', '{', '}', '(', ')', '|', '[', ']', '\\']);
          let escaped = '';
          for (const char of String(value)) {
            escaped += specials.has(char) ? '\\' + char : char;
          }
          return escaped;
        };

        const getQueryParam = (nameVariants) => {
          if (!Array.isArray(nameVariants)) {
            return null;
          }
          const searchParamsSupported = typeof URLSearchParams === 'function';
          const query = window.location.search || '';
          const params = searchParamsSupported ? new URLSearchParams(query) : null;
          for (const name of nameVariants) {
            if (!name) continue;
            if (params) {
              const value = params.get(name);
              if (value !== null) {
                return value;
              }
            } else {
              const pattern = new RegExp('(?:^|&)' + escapeRegexComponent(name) + '=([^&]*)', 'i');
              const match = query.slice(1).match(pattern);
              if (match) {
                return decodeURIComponent(match[1].replace(/\+/g, ' '));
              }
            }
          }
          return null;
        };

        const svgOnly = parseBoolQueryParam(getQueryParam(['svgOnly', 'svg_only']));
        const defaultSystemName = 'Maia';
        document.documentElement.dataset.svgOnly = svgOnly ? 'true' : 'false';
        window.EDGIS_SYSMAP_CONFIG = {
          svgOnly,
          defaultSystemName,
        };
        if (!svgOnly) {
          const panzoomScript = document.createElement('script');
          panzoomScript.src = '/static/js/panzoom.js';
          panzoomScript.defer = true;
          document.head.appendChild(panzoomScript);
        }
      })();
    </script>
  </head>
  <body>
    <div class="controls-panel" id="controlsPanel" style="display:none">
      <div class="form-grid">
        <label for="system">System</label>
        <input id="system" value="Maia">
        <button id="load" aria-label="Render">
          <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M5 5v14l7-5.5V19h3V5h-3v5.5z" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </div>
    <div id="stage">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet"></svg>

    </div>
    <!-- Toolbar -->
    <div class="toolbar">

          <line x1="15" y1="15" x2="20" y2="20" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>

        </svg>
      </button>

        </svg>
      </button>
      <button title="Download SVG" id="downloadSvgButton" style="padding-bottom: 0px;">

            <clipPath id="clipPath4297">
              <path d="m69.88 287.7h3.481v1.3194h-3.481zm0.8445-3.1455h1.792v3.1455h-1.792z" display="none" stroke-dashoffset="14.411" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.1041" style="paint-order:stroke markers fill"/>

        </svg>
      </button>
      <button title="Embed Options" id="copyEmbedButton" style="padding-bottom: 0px;">
        <svg width="26" height="26" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M10 6 5 12l5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M14 6l5 6-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="info-panel embed-panel" id="embedPanel" style="display:none">
      <div class="embed-panel__header">
        <h2>Embed this map</h2>
      </div>
      <p class="small">Use this URL to embed the currently viewed system map.</p>
      <div class="embed-panel__row">
        <input type="text" id="embedLinkInput" readonly>
        <button type="button" class="icon-button" id="embedLinkCopyButton" aria-label="Copy embed link">
          <svg width="22" height="22" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M8 8V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="3" y="8" width="13" height="13" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="sr-only">Copy</span>
        </button>
      </div>
      <p class="small">Or drop this iframe snippet into your page:</p>
      <div class="embed-panel__row embed-panel__row--textarea">
        <textarea id="embedCodeOutput" rows="3" readonly></textarea>
        <button type="button" class="icon-button" id="embedCodeCopyButton" aria-label="Copy iframe embed code">
          <svg width="22" height="22" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M8 8V5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="3" y="8" width="13" height="13" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="sr-only">Copy iframe code</span>
        </button>
      </div>
    </div>

    <!-- Info Panel -->
    <div class="info-panel" id="InfoPanel" style="display:none">
    </div>

    <footer>
      <div class="credit">
        <span>
          powered by <b><a target="_blank" href="https://edgis.elitedangereuse.fr"><span>EDGIS</span></a></b>
          of the <b><a target="_blank" href="https://elitedangereuse.fr"><span>Élite Dangereuse</span></a></b> Team
        </span>
        <img src="/static/assets/logo_o.svg" alt="Élite Dangereuse Logo"/>
      </div>
    </footer>

    <script>
      (function () {
        const config = window.EDGIS_SYSMAP_CONFIG || {};
        const svgOnlyMode = Boolean(config.svgOnly);
        const body = document.body;
        if (body) {
          body.classList.toggle('svg-only', svgOnlyMode);
          body.classList.toggle('full-ui', !svgOnlyMode);
        }
      })();
    </script>
    <script src="/static/js/sysmap.js" defer></script>
  </body>
</html>
