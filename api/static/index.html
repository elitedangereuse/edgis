    <script>
     function convertEdUrl(u) {
       const src = new URL(u);
       const dst = new URL("https://elitedangereuse.fr/outils/ed3ddrawer.php");
       dst.search = src.search;
       return dst.toString();
     }
     const quotes = [
       { "author": "Ram Tah", "text": "This is a gem of technology—even the Guardians would be jealous not to have it." },
       { "author": "The Imperial Herald", "text": "An achievement worthy of the Emperor’s highest praise." },
       { "author": "Felicity Farseer", "text": "Tuned to perfection—my long-range sensors took notes." },
       { "author": "Lakon Rep", "text": "More reliable than a Type-9 in a docking bay." },
       { "author": "Thargoid Scout (translated)", "text": "It is… acceptable." },
       { "author": "CMDR OptimusKoala", "text": "Now I have a real reason to explore!" },
       { "author": "Salvation", "text": "I have no idea what this is, but it looks dangerous." },
       { "author": "Seo Jin Hae", "text": "I can finally find my way home..." },
       { "author": "Raxxla", "text": "Damn… I'm screwed!" },
       { "author": "Aisling Duval", "text": "If it had more glitter, I’d endorse it immediately." },
       { "author": "Professor Palin", "text": "Fascinating… almost as fascinating as my thruster upgrades." },
       { "author": "Hudson Security Briefing", "text": "Classified… but highly recommended." },
       { "author": "Zemina Torval", "text": "I suppose it’s useful… for those who can’t afford an assistant." },
       { "author": "Li Yong-Rui", "text": "Finally, a tool worth investing in." },
       { "author": "Denton Patreus", "text": "With this, I could control half the galaxy in a week." },
     ];
     const quoteEl = document.getElementById('quote');
     const quoteAuthorEl = document.getElementById('quote-author');

     function secureRandomIndex(maxExclusive) {
       const cryptoObj = globalThis.crypto || globalThis.msCrypto;
       if (!cryptoObj || typeof cryptoObj.getRandomValues !== 'function') {
         console.warn('Secure randomness unavailable; defaulting to deterministic quote order.');
         return 0;
       }

       const bucketCount = maxExclusive;
       const randomBuffer = new Uint32Array(1);
       const maxUint = 0xffffffff;
       const limit = Math.floor((maxUint + 1) / bucketCount) * bucketCount;
       let value;
       do {
         cryptoObj.getRandomValues(randomBuffer);
         value = randomBuffer[0];
       } while (value >= limit);

       return value % bucketCount;
     }

     function showRandomQuote() {
       const i = secureRandomIndex(quotes.length);
       const { author, text } = quotes[i];
       quoteEl.textContent = `"${text}"`;
       quoteAuthorEl.textContent = `— ${author}`;
     }

     function cycleQuote() {
       showRandomQuote();
     }

     cycleQuote();
     setInterval(cycleQuote, 5000);

     const result = document.getElementById('result');
     let resultPre = document.getElementById('resultPre');
     globalThis.tableVisible = true;
     const statusEl = document.getElementById('status');
     const apiDocsLink = document.getElementById('apiDocsLink');

     if (apiDocsLink) {
       try {
         const docsUrl = new URL('/docs', globalThis.location.origin);
         apiDocsLink.href = docsUrl.toString();
       } catch (err) {
         console.warn('Unable to resolve docs URL', err);
       }
     }

     function setStatus(txt){ statusEl.textContent = txt; }
     function showResult(url, json) {
       const jsonString = JSON.stringify(json, null, 2);

       // Create a clean <pre> element
       const cleanPre = document.createElement('pre');
       cleanPre.className = 'text-sm text-gray-100 bg-transparent mono';
       cleanPre.textContent = jsonString;

       // Create wrapper div
       const wrapper = document.createElement('div');
       wrapper.id = 'resultPreContainer';
       wrapper.className = 'mt-3 relative';
       wrapper.appendChild(cleanPre);

       // Create copy button
       const copyBtn = document.createElement('button');
       copyBtn.className = 'clipboard-button absolute top-2 right-2 p-1.5 text-white transition text-xs z-20 focus:outline-none focus:ring-2 focus:ring-[var(--accent-blue)] focus:ring-offset-1 focus:ring-offset-gray-800 rounded';
       copyBtn.title = 'Copy JSON to clipboard';
       copyBtn.innerHTML = copyIconSvg;

       copyBtn.onclick = () => {
         navigator.clipboard.writeText(jsonString).then(() => {
           copyBtn.innerHTML = `<span class="text-xs text-green-400">Copied!</span>`;
           setTimeout(() => {
             copyBtn.innerHTML = copyIconSvg;
           }, 1500);
         }).catch(err => {
           console.error('Copy failed:', err);
           copyBtn.innerHTML = `<span class="text-xs text-red-400">Fail</span>`;
           setTimeout(() => {
             copyBtn.innerHTML = copyIconSvg;
           }, 1500);
         });
       };

       wrapper.appendChild(copyBtn);

       // Replace the old container with the new one
       const oldContainer = document.getElementById('resultPreContainer');
       if (oldContainer) {
         oldContainer.replaceWith(wrapper);
       } else {
         // Fallback (shouldn't happen if HTML has initial container)
         document.getElementById('result').appendChild(wrapper);
       }

       // Update reference
       resultPre = cleanPre; // Still useful for other logic?

       // --- Update count and map link ---
       const countEl = document.getElementById('resultCount');
       let count = null;
       if (Array.isArray(json)) {
         count = json.length;
       }

       if (count !== null) {
         countEl.textContent = `Found ${count} system${count !== 1 ? 's' : ''}.`;
       } else {
         countEl.textContent = '';
       }

       result.style.display = 'block';

       // --- Update table if visible ---
       if (globalThis.tableVisible) {
         resultTable.style.display = 'block';
         resultPre.style.display = 'none';
         resultTable.innerHTML = jsonToTable(json);
       } else {
         resultTable.style.display = 'none';
         resultPre.style.display = 'block';
       }
     }

     async function callApi(path){
       setStatus('Querying API...');
       try{
         const base = globalThis.location.origin;
         const url = base + path;
         const res = await fetch(url);
         const json = await res.json();
         if(!res.ok){
           throw new Error(json.error || ('HTTP ' + res.status));
         }
         showResult(url, json);
         setStatus('OK — response received');
         result.style.display = 'block';
       }catch(err){
         showResult(path, {error: String(err.message)});
         setStatus('Error');
       }
     }

    document.getElementById('searchForm').addEventListener('submit', e=>{
      e.preventDefault();
      const q = encodeURIComponent(document.getElementById('q').value.trim());
      if(!q) return;
      callApi('/coords?q=' + q);
    });
    const predictInput = document.getElementById('predictInput');
    const predictBtn = document.getElementById('predictBtn');
    const neighborsInput = document.getElementById('neighborsInput');
    const neighborsBtn = document.getElementById('neighborsBtn');
    const routeForm = document.getElementById('routeForm');
    const routeStart = document.getElementById('routeStart');
    const routeGoal = document.getElementById('routeGoal');
    const routeRange = document.getElementById('routeRange');
    const routeStatus = document.getElementById('routeStatus');

    const tabButtons = Array.from(document.querySelectorAll('.tool-tab'));
    const tabPanels = {
      lookup: document.getElementById('panel-lookup'),
      advanced: document.getElementById('panel-advanced'),
      route: document.getElementById('panel-route'),
    };

    function activateTab(name) {
      for (const btn of tabButtons) {
        const isActive = btn.dataset.tab === name;
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
        btn.tabIndex = isActive ? 0 : -1;
      }

      for (const [key, panel] of Object.entries(tabPanels)) {
        if (!panel) continue;
        const isActive = key === name;
        panel.classList.toggle('hidden', !isActive);
        panel.setAttribute('aria-hidden', isActive ? 'false' : 'true');
      }

      try {
        localStorage.setItem('edgis-active-tab', name);
      } catch (err) {
        console.warn('Unable to persist tab selection', err);
      }
    }

    const storedTab = (() => {
      try {
        return localStorage.getItem('edgis-active-tab');
      } catch {
        return null;
      }
    })();

    activateTab(tabPanels[storedTab] ? storedTab : 'lookup');

    for (const btn of tabButtons) {
      btn.addEventListener('click', () => activateTab(btn.dataset.tab));
    }

    function submitPredict(){
      const value = predictInput.value.trim();
      if(!value) return;
      activateTab('advanced');
      callApi('/coords/predict?q=' + encodeURIComponent(value));
    }

    function submitNeighbors(){
      const parts = neighborsInput.value.split(',').map(s=>s.trim());
      if(parts.length < 4 || parts.slice(0,4).includes(p => p === '')) return;
      activateTab('lookup');
      callApi(`/neighbors?x=${encodeURIComponent(parts[0])}&y=${encodeURIComponent(parts[1])}&z=${encodeURIComponent(parts[2])}&radius=${encodeURIComponent(parts[3])}`);
    }

    predictBtn.addEventListener('click', submitPredict);
    predictInput.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){
        e.preventDefault();
        submitPredict();
      }
    });

    neighborsBtn.addEventListener('click', submitNeighbors);
    neighborsInput.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){
        e.preventDefault();
        submitNeighbors();
      }
    });

    function formatLy(value){
      return Number.isFinite(value) ? value.toFixed(2) : '—';
    }

    function computeTotalDistance(route, reported){
      if (Number.isFinite(reported)) {
        return reported;
      }
      return route.reduce((sum, node, idx) => {
        if (idx === 0) return sum;
        const jump = Number(node?.dist ?? 0);
        return Number.isFinite(jump) ? sum + jump : sum;
      }, 0);
    }

    function buildRouteRows(route, totalDistance){
      if (!Array.isArray(route) || route.length === 0) {
        return [];
      }

      const total = computeTotalDistance(route, totalDistance);
      let traversed = 0;

      return route.map((node, idx) => {
        const jumpVal = idx === 0 ? 0 : Number(node?.dist ?? 0);
        if (idx > 0 && Number.isFinite(jumpVal)) {
          traversed += jumpVal;
        }
        const remainingVal = idx === route.length - 1 ? 0 : Math.max(total - traversed, 0);
        const systemName = node?.name || node?.id64 || `Waypoint ${idx + 1}`;

        const departStar =
          node?.depart_mainstar ??
          (idx > 0 ? route[idx - 1]?.mainstar : node?.mainstar);
        const arrivalStar = node?.mainstar ?? null;

        return {
          step: idx + 1,
          system: systemName,
          depart_mainstar: departStar,
          arrival_mainstar: arrivalStar,
          jump_ly: idx === 0 || !Number.isFinite(jumpVal) ? null : Number(jumpVal.toFixed(2)),
          remaining_ly: Number(remainingVal.toFixed(2))
        };
      });
    }

    if (routeForm) {
      routeForm.addEventListener('submit', async event => {
        event.preventDefault();
        const start = routeStart.value.trim();
        const goal = routeGoal.value.trim();
        const jumpRange = Number(routeRange.value) || 70;
        if (!start || !goal) {
          routeStatus.textContent = 'Start and goal are required.';
          return;
        }

        activateTab('route');
        globalThis.tableVisible = true;
        routeStatus.textContent = 'Plotting route...';
        setStatus('Querying API...');

        const params = new URLSearchParams({
          start,
          goal,
          jump_range: String(jumpRange)
        });
        const requestUrl = new URL(`/route/bidirectional?${params.toString()}`, globalThis.location.origin);

        try {
          const res = await fetch(requestUrl.toString());
          const data = await res.json();
          if (!res.ok || data.error) {
            throw new Error(data.error || `HTTP ${res.status}`);
          }

          const route = Array.isArray(data.route) ? data.route : [];
          if (!route.length) {
            routeStatus.textContent = 'No route found.';
            showResult(requestUrl.toString(), route);
            return;
          }

          const total = computeTotalDistance(route, data.total_distance);
          const jumpCount = Math.max(route.length - 1, 0);
          const avg = jumpCount > 0 ? total / jumpCount : Number.NaN;
          const tableRows = buildRouteRows(route, total).map(row => ({
            step: row.step,
            system: row.system,
            depart_mainstar: row.depart_mainstar ?? '—',
            arrival_mainstar: row.arrival_mainstar ?? '—',
            jump_ly: row.jump_ly ?? '—',
            remaining_ly: row.remaining_ly
          }));

          showResult(requestUrl.toString(), tableRows);

          routeStatus.textContent = `Route ready: ${jumpCount} jumps · ${route.length} systems · total ${formatLy(total)} ly · avg ${formatLy(avg)} ly.`;
          setStatus('OK — response received');
          result.style.display = 'block';
        } catch (err) {
          console.error(err);
          showResult(requestUrl.toString(), { error: err.message });
          routeStatus.textContent = `Error: ${err.message}`;
          setStatus('Error');
        }
      });
    }

     function openSystemMap(text, btnElement){
       const url = `https://elitedangereuse.fr/outils/sysmap.php?system=${text}`;
       window.open(url, "_blank");
     }

     function openCoordsMap(x, y, z){
       const url = convertEdUrl(`https://elitedangereuse.fr/outils/ed3ddrawer.php?x=${x}&y=${y}&z=${z}&radius=10`);
       window.open(url, "_blank");
     }

     function copyToClipboard(text, btnElement) {
       navigator.clipboard.writeText(text).then(() => {
         btnElement.innerHTML = '<span class="text-xs text-green-400">Copied!</span>';
         setTimeout(() => {
           btnElement.innerHTML = copyIconSvg;
         }, 1500);
       }).catch(err => {
         console.error('Copy failed:', err);
         btnElement.innerHTML = '<span class="text-xs text-red-400">Fail</span>';
         setTimeout(() => {
           btnElement.innerHTML = copyIconSvg;
         }, 1500);
       });
     }

     function jsonToTable(data) {
       if (!Array.isArray(data)) {
         data = [data]; // wrap single object
       }
       if (!data || data.length === 0) {
         return "<p class='text-gray-400 text-sm'>No data available</p>";
       }

       const keys = Object.keys(data[0]);

       // 🔹 Only keep the first 100 rows
       const MAX_ROWS = 100;
       const limitedData = data.slice(0, MAX_ROWS);

       let html = `
         <div class="mb-3">
           <input id="tableSearch" type="text" placeholder="Filter results..."
                  class="w-full sm:w-1/2 px-2 py-1 glass mono text-xs placeholder:text-gray-500 focus:ring-0 outline-none"
                  style="border:0">
         </div>
         <div class="overflow-x-auto rounded-xl">
           <table class="w-full border-collapse text-gray-200 text-xs" id="interactiveTable">
             <thead class="bg-[rgba(255,255,255,0.04)] text-[var(--accent-blue)] uppercase tracking-wide">
               <tr>
                 ${keys.map(k => `
       <th class="px-2 py-1 border-b border-[rgba(255,255,255,0.1)] cursor-pointer hover:text-white transition text-xs"
       data-key="${k}">
       ${k} <span class="sort-indicator text-gray-500"></span>
       </th>`).join("")}
       <th class="px-2 py-1 border-b border-[rgba(255,255,255,0.1)] text-xs uppercase tracking-wide text-[var(--accent-blue)]">Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          ${buildRows(limitedData, keys)}
        </tbody>
      </table>
    </div>
    ${data.length > MAX_ROWS ? `<p class="mt-2 text-xs text-gray-400">Showing first ${MAX_ROWS} of ${data.length} results.</p>` : ""}
     `;

       // … keep the search/sort logic the same (if you want search to apply to all, you’d still pass full data instead of limitedData)
       setTimeout(() => {
         const tbody = document.getElementById("tableBody");
         const searchInput = document.getElementById("tableSearch");
         const headerEls = document.querySelectorAll("#interactiveTable th");

         let sortState = {};

         for (const th of headerEls) {
           th.addEventListener("click", () => {
             const key = th.dataset.key;
             if (!key) return;
             sortState[key] = sortState[key] === "asc" ? "desc" : "asc";

             // Sorting only within limitedData
             limitedData.sort((a, b) => compareValues(a[key], b[key], sortState[key]));
             tbody.innerHTML = buildRows(limitedData, keys);

             const indicators = document.querySelectorAll(".sort-indicator");
             for (const el of indicators) {
               el.textContent = "";
             }
             th.querySelector(".sort-indicator").textContent = sortState[key] === "asc" ? "▲" : "▼";
           });
         }

         searchInput.addEventListener("input", () => {
           const q = searchInput.value.toLowerCase();
           const filtered = data.filter(row =>
             keys.some(k => String(row[k]).toLowerCase().includes(q))
           ).slice(0, MAX_ROWS);
           tbody.innerHTML = buildRows(filtered, keys);
         });
       }, 0);

       return html;
     }

     function escapeQuotes(str) {
       return String(str).replaceAll('\'', "&#39;");
     }

     function fillNeighborsInput(x, y, z) {
       const neighborsInput = document.getElementById('neighborsInput');

       neighborsInput.focus();

       // Optional: show status
       setStatus(`Neighbors input filled: x=${x}, y=${y}, z=${z}, r=10`);
     }

     function buildRows(rows, keys) {
       return rows.map((row, i) => `
    <tr class="group ${i % 2 === 0 ? 'bg-[rgba(255,255,255,0.02)]' : ''} hover:bg-[rgba(255,255,255,0.08)] transition">

        let v = row[k];
        if (k === "distance" && typeof v === "number") v = v.toFixed(1);

        // Special handling: coords
if (k === "coords" && typeof v === "object" && v !== null) {
  const { x, y, z } = v;
  const formatted = `${x.toFixed(3)},${y.toFixed(3)},${z.toFixed(3)}`;
  const fullPrecision = `${x},${y},${z}`;

  return `
         <td

         title="x: ${fullPrecision}"
         >
         <span class="text-gray-300 tabular-nums">${formatted}</span>
         </td>
         `;
}
        // Special handling: 'name' field (copy button)
        if (k === "name" && typeof v === "string") {
          return `
         <td class="px-2 py-1 border-b border-[rgba(255,255,255,0.08)] mono">
         <div class="flex items-center gap-2">
         <span class="flex-1">${v}</span>

         onclick="copyToClipboard('${escapeQuotes(v)}', this)"
         >
         ${copyIconSvg}
         </button>
         </div>
         </td>
         `;
        }

        // Default cell
        if (typeof v === "object" && v !== null) v = JSON.stringify(v);
        return `<td class="px-2 py-1 border-b border-[rgba(255,255,255,0.08)] mono">${v ?? ""}</td>`;
      }).join("")}
    <td class="px-2 py-1 border-b border-[rgba(255,255,255,0.08)]">
      ${buildActionsCell(row)}
    </td>
    </tr>
        `).join("");
     }

     function buildActionsCell(row) {
       const parts = [];

       if (typeof row.name === "string" && row.name.trim()) {
         parts.push(`
         <button
         title="View system map"
         class="opacity-30 hover:opacity-100 group-hover:opacity-100 focus:opacity-100 transition-all duration-200 p-1 rounded text-[var(--accent-blue)] focus:outline-none focus:ring-2 focus:ring-[var(--accent-blue)] focus:ring-offset-1 focus:ring-offset-gray-800"
         onclick="openSystemMap('${escapeQuotes(row.name)}', this)"
         >
         ${systemMapIconSvg}
         </button>
         `);
       }

       if (row.coords && typeof row.coords === "object") {
         const { x, y, z } = row.coords;
         if ([x, y, z].every(val => typeof val === "number")) {
           parts.push(`
         <button
         type="button"
         title="Open galaxy map"
         class="opacity-30 hover:opacity-100 group-hover:opacity-100 focus:opacity-100 transition-all duration-200 p-1 rounded text-[var(--accent-blue)] focus:outline-none focus:ring-2 focus:ring-[var(--accent-blue)] focus:ring-offset-1 focus:ring-offset-gray-800"
         onclick="openCoordsMap('${x}','${y}','${z}')"
         >
         ${galaxyMapIconSvg}
         </button>
         `, `
         <button
         type="button"
         title="Search neighbors within 10 ly"
         class="opacity-30 hover:opacity-100 group-hover:opacity-100 focus:opacity-100 transition-all duration-200 px-2 py-1 text-xs rounded focus:outline-none focus:ring-2 focus:ring-[var(--accent-blue)] focus:ring-offset-1 focus:ring-offset-gray-800"
         onclick="fillNeighborsInput('${x}','${y}','${z}')"
         >
         <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-compass" viewBox="0 0 16 16">
         <path d="M8 16.016a7.5 7.5 0 0 0 1.962-14.74A1 1 0 0 0 9 0H7a1 1 0 0 0-.962 1.276A7.5 7.5 0 0 0 8 16.016m6.5-7.5a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0"/>
         <path d="m6.94 7.44 4.95-2.83-2.83 4.95-4.949 2.83 2.828-4.95z"/>
         </svg>
         </button>
         `);
         }
       }

       if (!parts.length) {
         return `<span class="text-gray-500 text-xs">—</span>`;
       }

       return `<div class="flex items-center gap-2">${parts.join("")}</div>`;
     }

     function compareValues(a, b, dir) {
       if (typeof a === "string") a = a.toLowerCase();
       if (typeof b === "string") b = b.toLowerCase();
       if (a < b) return dir === "asc" ? -1 : 1;
       if (a > b) return dir === "asc" ? 1 : -1;
       return 0;
     }
