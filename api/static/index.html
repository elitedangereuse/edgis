     function secureRandomIndex(maxExclusive) {
       const cryptoObj = globalThis.crypto || globalThis.msCrypto;
       if (!cryptoObj || typeof cryptoObj.getRandomValues !== 'function') {
         console.warn('Secure randomness unavailable; defaulting to deterministic quote order.');
         return 0;
       }

       const bucketCount = maxExclusive;
       const randomBuffer = new Uint32Array(1);
       const maxUint = 0xffffffff;
       const limit = Math.floor((maxUint + 1) / bucketCount) * bucketCount;
       let value;
       do {
         cryptoObj.getRandomValues(randomBuffer);
         value = randomBuffer[0];
       } while (value >= limit);

       return value % bucketCount;
     }

     function stripTrailingDots(str) {
       let end = str.length;
       while (end > 0 && str.codePointAt(end - 1) === 46) {
         end -= 1;
       }
       return end === str.length ? str : str.slice(0, end);
     }

     function setStatus(txt){
       if (!statusEl) return;
       if (!txt) {
         statusEl.textContent = '';
         statusEl.classList.remove('status--loading');
         statusEl.removeAttribute('aria-label');
         return;
       }

       const isLoading = typeof txt === 'string' && txt.toLowerCase().includes('querying api');
       statusEl.classList.toggle('status--loading', isLoading);

       if (isLoading) {
         const base = stripTrailingDots(txt).trim() || 'Querying API';
         const dotMatches = txt.match(/\./g);
         const dotCount = Math.max(dotMatches ? dotMatches.length : 0, 3);
         const dotsMarkup = Array.from({ length: dotCount }, (_, idx) =>
           `<span class="status-dot status-dot--${idx + 1}" aria-hidden="true">.</span>`
         ).join('');
         statusEl.innerHTML = `<span class="status-label">${escapeHtml(base)}</span>${dotsMarkup}`;
         statusEl.setAttribute('aria-label', `${base}${'.'.repeat(dotCount)}`);
       } else {
         statusEl.textContent = txt;
         statusEl.removeAttribute('aria-label');
       }
     }

     async function callApi(path, kindHint = null){
       setStatus('Querying API...');
       beginApiRequest();
       try{
         const base = globalThis.location.origin;
         const url = base + path;
         const res = await fetch(url);
         const json = await res.json();
         if(!res.ok){
           throw new Error(json.error || ('HTTP ' + res.status));
         }
         const kind = kindHint ?? detectResultKind(path);
         showResult(url, json, kind);
         setStatus('OK — response received');
         result.style.display = 'block';
       }catch(err){
         const kind = kindHint ?? detectResultKind(path);
         showResult(path, {error: String(err.message)}, kind);
         setStatus('Error');
       } finally {
         endApiRequest();
       }
     }

    async function requestSystemAutocomplete(value, targetList, options = {}) {
      if (!targetList) {
        return;
      }
      const trimmed = value.trim();
      if (!hasMinimumChars(trimmed)) {
        clearSuggestions(targetList);
        return;
      }

      const { isSuppressed } = options;

      try {
        const url = new URL('/systems/autocomplete', globalThis.location.origin);
        url.searchParams.set('q', trimmed);
        const response = await fetch(url.toString());
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        const payload = await response.json();
        const suggestions = (Array.isArray(payload?.suggestions)
          ? payload.suggestions
          : [])
          .filter(name => typeof name === 'string' && name.trim().toLowerCase() !== trimmed.toLowerCase());
        if (typeof isSuppressed === 'function' && isSuppressed()) {
          return;
        }
        targetList.innerHTML = suggestions
          .map(name => `<option value="${escapeAttr(name)}"></option>`)
          .join('');
      } catch (error) {
        console.warn('Autocomplete failed', error);
      }
    }

    function setupAutocompleteInput(inputEl, datalistEl, validator = hasMinimumChars) {
      const noop = () => {};
      if (!inputEl || !datalistEl) {
        return noop;
      }
      let timerId = null;
      let suppressAutocomplete = false;

      const dismissAutocomplete = () => {
        suppressAutocomplete = true;
        clearSuggestions(datalistEl);
      };

      inputEl.addEventListener('input', () => {
        suppressAutocomplete = false;
        if (timerId) {
          clearTimeout(timerId);
        }
        const value = inputEl.value;
        if (!validator(value)) {
          clearSuggestions(datalistEl);
          return;
        }
        timerId = setTimeout(
          () => requestSystemAutocomplete(value, datalistEl, {
            isSuppressed: () => suppressAutocomplete,
          }),
          200
        );
      });

      return dismissAutocomplete;
    }

    async function refreshSystemFromSpansh(systemId64, buttonEl) {
      const id = String(systemId64 ?? '').trim();

      if (btn) {
        btn.disabled = true;
        if (!btn.dataset.originalTitle) {

        btn.classList.add('is-busy');

      }

      setStatus(`Refreshing ${id} from Spansh...`);

      try {
        const response = await fetch(`/bodies/${encodeURIComponent(id)}/spansh-refresh`, {
          method: 'POST',
        });
        let payload = {};
        try {
          payload = await response.json();
        } catch (err) {
          console.error('Failed to parse API response as JSON', err);
          payload = { error: 'Invalid JSON response from API' };
        }
        if (!response.ok || payload?.error || payload?.detail) {
          const message = payload?.detail || payload?.error || `HTTP ${response.status}`;
          throw new Error(message);
        }

        setStatus(`Spansh refresh complete for ${id}. Updating table...`);
        const refreshValue = lastBodiesLookupValue?.trim()
          || bodiesInput?.value?.trim()

        if (refreshValue) {
          submitBodies({
            skipPermalinkUpdate: true,
            overrideValue: refreshValue,

          });

      } catch (err) {
        console.error('Failed to refresh system from Spansh', err);
        setStatus(`Failed to refresh ${id}: ${err?.message || err}`);
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.removeAttribute('aria-busy');
          btn.classList.remove('is-busy');
          if (btn.dataset.originalTitle) {
            btn.title = btn.dataset.originalTitle;
            delete btn.dataset.originalTitle;
          } else {

     async function resolveNeighborsByName(nameInput) {
       const name = nameInput.trim();
       if (!name) {
         setStatus('Provide a system name to search for neighbors');

       setStatus(`Resolving coordinates for ${name}`);
       try {
         const base = globalThis.location.origin;

         const payload = await res.json();
         if (!res.ok || !payload?.coords) {

         }
         const { x, y, z } = payload.coords;
         if ([x, y, z].some(val => !Number.isFinite(val))) {
           throw new Error('System coordinates are incomplete');
         }
         const radius = payload.radius ?? '20';
         callApi(`/neighbors?x=${encodeURIComponent(x)}&y=${encodeURIComponent(y)}&z=${encodeURIComponent(z)}&radius=${encodeURIComponent(radius)}`, 'neighbors');

     function formatLy(value){
       return Number.isFinite(value) ? value.toFixed(2) : '—';

     function computeTotalDistance(route, reported){
       if (Number.isFinite(reported)) {
         return reported;
       }
       return route.reduce((sum, node, idx) => {
         if (idx === 0) return sum;
         const jump = Number(node?.dist ?? 0);
         return Number.isFinite(jump) ? sum + jump : sum;
       }, 0);
     }

     function buildRouteRows(route, totalDistance){
       if (!Array.isArray(route) || route.length === 0) {
         return [];
       }

       const total = computeTotalDistance(route, totalDistance);
       let traversed = 0;

       return route.map((node, idx) => {
         const jumpVal = idx === 0 ? 0 : Number(node?.dist ?? 0);
         if (idx > 0 && Number.isFinite(jumpVal)) {
           traversed += jumpVal;
         }
         const remainingVal = idx === route.length - 1 ? 0 : Math.max(total - traversed, 0);
         const systemName = node?.name || node?.id64 || `Waypoint ${idx + 1}`;

         const departStar =
           node?.depart_mainstar ??
           (idx > 0 ? route[idx - 1]?.mainstar : node?.mainstar);
         const arrivalStar = node?.mainstar ?? null;

         return {
           step: idx + 1,
           system: systemName,
           depart_mainstar: departStar,
           arrival_mainstar: arrivalStar,
           jump_ly: idx === 0 || !Number.isFinite(jumpVal) ? null : Number(jumpVal.toFixed(2)),
           remaining_ly: Number(remainingVal.toFixed(2))
         };
       });
     }

     if (routeForm) {
       routeForm.addEventListener('submit', async event => {
         event.preventDefault();
         const start = routeStart.value.trim();
         const goal = routeGoal.value.trim();
         const jumpRange = Number(routeRange.value) || 70;
         if (!start || !goal) {
           routeStatus.textContent = 'Start and goal are required.';
           return;
         }

         activateTab('route');
         globalThis.tableVisible = true;
         routeStatus.textContent = 'Plotting route...';
         setStatus('Querying API...');

         const params = new URLSearchParams({
           start,
           goal,
           jump_range: String(jumpRange)
         });
         const requestUrl = new URL(`/route/bidirectional?${params.toString()}`, globalThis.location.origin);

         try {
           const res = await fetch(requestUrl.toString());
           const data = await res.json();
           if (!res.ok || data.error) {
             throw new Error(data.error || `HTTP ${res.status}`);
           }

           const route = Array.isArray(data.route) ? data.route : [];
           if (!route.length) {
             routeStatus.textContent = 'No route found.';
             showResult(requestUrl.toString(), route, 'route');
             return;
           }

           const total = computeTotalDistance(route, data.total_distance);
           const jumpCount = Math.max(route.length - 1, 0);
           const avg = jumpCount > 0 ? total / jumpCount : Number.NaN;
           const tableRows = buildRouteRows(route, total).map(row => ({
             step: row.step,
             system: row.system,
             depart_mainstar: row.depart_mainstar ?? '—',
             arrival_mainstar: row.arrival_mainstar ?? '—',
             jump_ly: row.jump_ly ?? '—',
             remaining_ly: row.remaining_ly
           }));

           showResult(requestUrl.toString(), tableRows, 'route');

           routeStatus.textContent = `Route ready: ${jumpCount} jumps · ${route.length} systems · total ${formatLy(total)} ly · avg ${formatLy(avg)} ly.`;
           setStatus('OK — response received');
           result.style.display = 'block';
         } catch (err) {
           console.error(err);
           showResult(requestUrl.toString(), { error: err.message }, 'route');
           routeStatus.textContent = `Error: ${err.message}`;
           setStatus('Error');
         }
       });
     }

     function jsonToTable(data, kind = null) {
       const rows = normalizeTableData(data);
     if (!rows.length) {
       return "<p class='text-gray-400 text-sm'>No data available</p>";
     }

      if (kind === 'body-detail' && rows.length === 1 && typeof rows[0] === 'object') {
        return renderBodyDetailTable(rows[0]);
      }

      const keys = pickKeysForTable(rows, kind);
      const limited = limitRows(rows, 100);
      const tableHtml = buildTableShell(keys, limited, kind, rows.length);
      activateTableInteractions(limited, keys, kind);
      return tableHtml;
    }

     function normalizeTableData(data) {
       if (!Array.isArray(data)) {
         return data ? [data] : [];
       }
       return data.filter(Boolean);
     }

     function pickKeysForTable(rows, kind) {
       if (kind === 'nearest-neutron') {
         const preferred = ['neutron_name', 'neutron_id64', 'coords', 'distance_ly'];
         const available = preferred.filter(key => rows.some(row => Object.hasOwn(row ?? {}, key)));
         if (available.length) {
           return available;
         }
       }

       if (kind !== 'bodies') {
         return Object.keys(rows[0] ?? {});
       }
       const available = new Set();
       for (const row of rows) {
         for (const field of BODY_TABLE_FIELDS) {
           if (Object.hasOwn(row, field)) {
             available.add(field);
           }
         }
       }
       const selected = BODY_TABLE_FIELDS.filter(field => {
         if (field === 'body_type') {
           return true;
         }
         return available.has(field);
       });
       return selected.length ? selected : Object.keys(rows[0] ?? {});
     }

     function limitRows(rows, max) {
       return rows.slice(0, max);
     }

     function getLookupTarget(payload) {

     function extractSystemName(target) {

       if (typeof target.name === 'string' && target.name.trim()) {

    function extractCoords(target) {

     function updateLookupActionButtons(payload, kind) {

       if (kind !== 'system-lookup') {
         hideLookupActionButtons();

      const target = getLookupTarget(payload);
      if (!target) {
        hideLookupActionButtons();
        return;
      }

      const systemName = extractSystemName(target);
      const coords = extractCoords(target);
      const hasName = applySystemMapState(systemName);
      const hasCoords = applyGalaxyMapState(coords);
      const hasNeighborAction = applyNeighborsActionState(coords);

      if (!hasName && !hasCoords && !hasNeighborAction) {
        hideLookupActionButtons();
        return;

     function formatAxisValue(value) {
       return Number.isFinite(value) ? value.toFixed(2) : '—';
     }

     function normalizeStarType(value) {
       if (!value) return '';
       const trimmed = String(value).trim();
       if (!trimmed) return '';
       if (STAR_TYPE_NAME_MAP[trimmed]) {
         return trimmed;
       }
       const reverseKey = STAR_TYPE_REVERSE_MAP[trimmed.toUpperCase()];
       if (reverseKey) {
         return reverseKey;
       }
       return trimmed.toUpperCase().replaceAll(/[^A-Z0-9]+/g, '_');
     }

     function getHumanReadableStarType(value) {
       if (!value) {
         return 'Unknown Star';
       }
       const trimmed = String(value).trim();
       if (!trimmed) {
         return 'Unknown Star';
       }
       const normalized = normalizeStarType(trimmed);
       if (normalized && STAR_TYPE_NAME_MAP[normalized]) {
         return STAR_TYPE_NAME_MAP[normalized];
       }
       return 'Unknown Star';
     }

     function getShortStarType(value) {
       if (!value) return '—';
       const normalized = normalizeStarType(value);
       if (normalized && STAR_TYPE_SHORT_MAP[normalized]) {
         return STAR_TYPE_SHORT_MAP[normalized];
       }
       return String(value).trim().split(' ')[0] || '—';
     }

     function getStarIndicatorConfig(value) {
       if (!value) return null;
       const normalized = normalizeStarType(value);
       if (!normalized) return null;
       if (normalized === 'N') {
         return { icon: neutronIndicatorSvg };
       }
       const color = STAR_COLOR_MAP[normalized] ?? STAR_COLOR_MAP[normalized.split('_')[0]] ?? STAR_COLOR_FALLBACK;
       return { color };
     }

     function applyStarIndicator(starValue) {
       if (!systemMainstarIndicator) {
         return;
       }
       systemMainstarIndicator.classList.remove('is-active', 'is-neutron');
       systemMainstarIndicator.style.background = '';
       systemMainstarIndicator.style.borderColor = '';
       systemMainstarIndicator.innerHTML = '';
       const config = getStarIndicatorConfig(starValue);
       if (!config) {
         return;
       }
       systemMainstarIndicator.classList.add('is-active');
       if (config.icon) {
         systemMainstarIndicator.classList.add('is-neutron');
         systemMainstarIndicator.innerHTML = config.icon;
       } else if (config.color) {
         systemMainstarIndicator.style.background = config.color;
         systemMainstarIndicator.style.borderColor = config.color;
       }
     }

     function getMainstarDisplay(target) {
       const raw = target && typeof target.mainstar === 'string' ? target.mainstar.trim() : '';
       return {
         raw,
         label: getHumanReadableStarType(raw) || 'Uncatalogued star'
       };
     }

     function updateSystemLookupCard(payload, kind) {

       if (coords) {
         setSystemCardField(systemCoordX, formatAxisValue(coords.x));
         setSystemCardField(systemCoordY, formatAxisValue(coords.y));
         setSystemCardField(systemCoordZ, formatAxisValue(coords.z));
       } else {
         setSystemCardField(systemCoordX, '—');
         setSystemCardField(systemCoordY, '—');
         setSystemCardField(systemCoordZ, '—');
       }
     }

     function extractBodiesSystemFromUrl(source) {
       if (typeof source !== 'string' || !source) {
         return '';
       }
       try {
         const parsed = source.includes('://')
                      ? new URL(source)
                      : new URL(source, globalThis.location.origin);
         const raw = parsed.searchParams.get('name_or_id');
         return raw ? raw.trim() : '';
       } catch {
         return '';
       }
     }

     function resolveBodiesSystemName(requestUrl) {
       const fromUrl = extractBodiesSystemFromUrl(requestUrl);
       if (fromUrl) {
         return fromUrl;
       }
       return lastBodiesLookupValue?.trim() || '';
     }

     function buildBodiesEmbedUrl(systemName) {
       return `https://elitedangereuse.fr/outils/sysmap.php?svgOnly=1&system=${encodeURIComponent(systemName)}`;
     }

     function resetBodiesEmbed() {
       if (!bodiesEmbedContainer) {
         return;
       }
       bodiesEmbedContainer.hidden = true;
       if (bodiesEmbedFrame) {
         bodiesEmbedFrame.removeAttribute('src');
         delete bodiesEmbedFrame.dataset.src;
       }
       if (bodiesEmbedCaption) {
         bodiesEmbedCaption.textContent = 'Select a system to preview its map.';
       }
       if (bodiesEmbedOpenBtn) {
         bodiesEmbedOpenBtn.hidden = true;
         delete bodiesEmbedOpenBtn.dataset.href;
         delete bodiesEmbedOpenBtn.dataset.systemName;
       }
     }

     function updateBodiesEmbed(payload, kind, requestUrl) {
       if (!bodiesEmbedContainer) {
         return;
       }
       const hasError = Boolean(payload && !Array.isArray(payload) && typeof payload === 'object' && payload.error);
       if (kind !== 'bodies' || hasError) {
         resetBodiesEmbed();
         return;
       }

       const rawName = resolveBodiesSystemName(requestUrl).trim();
       if (!rawName) {
         resetBodiesEmbed();
         return;
       }

       const embedUrl = buildBodiesEmbedUrl(rawName);
       if (bodiesEmbedFrame && bodiesEmbedFrame.dataset.src !== embedUrl) {
         bodiesEmbedFrame.src = embedUrl;
         bodiesEmbedFrame.dataset.src = embedUrl;
       }
       if (bodiesEmbedCaption) {
         bodiesEmbedCaption.textContent = `System map preview for ${rawName}`;
       }
       if (bodiesEmbedOpenBtn) {
         bodiesEmbedOpenBtn.hidden = false;
         bodiesEmbedOpenBtn.dataset.systemName = rawName;
         bodiesEmbedOpenBtn.dataset.href = embedUrl;
       }
       bodiesEmbedContainer.hidden = false;
     }

     function buildTableShell(keys, limitedData, kind, totalCount) {
       const MAX_ROWS = limitedData.length;
       const rowsHtml = buildRows(limitedData, keys, kind);
       const collapsibleKeys = keys.filter(k => isCollapsibleColumn(kind, k));
       const headers = keys.map(k => {
         const safeKey = escapeAttr(k);
         const headerLabel = escapeAttr(getColumnLabel(k));
         const classes = [
           'px-2',
           'py-1',
           'border-b',
           'border-[rgba(255,255,255,0.1)]',
           'cursor-pointer',
           'hover:text-white',
           'transition',
           'text-xs'
         ];
         if (isCollapsibleColumn(kind, k)) {
           classes.push('collapsible-col', 'is-collapsed');
         }
         return `
      <th class="${classes.join(' ')}"
          data-key="${safeKey}"
          data-column="${safeKey}">
        ${headerLabel} <span class="sort-indicator text-gray-500"></span>
      </th>`;
       }).join("");

       const limitedNote = totalCount > MAX_ROWS
                                      ? `<p class="mt-2 text-xs text-gray-400">Showing first ${MAX_ROWS} of ${totalCount} results.</p>`
                                      : "";

       const collapseToggle = collapsibleKeys.length
                            ? `<button id="tableCollapseToggle" class="table-collapse-toggle" data-columns="${collapsibleKeys.map(escapeAttr).join(',')}" data-state="collapsed">Show ID64</button>`
                            : '';

       return `
      <div class="mb-3">
        ${collapseToggle}
        <input id="tableSearch" type="text" placeholder="Filter results..."
               class="w-full sm:w-1/2 px-2 py-1 glass mono text-xs placeholder:text-gray-500 focus:ring-0 outline-none"
               style="border:0">
      </div>
      <div class="responsive-table-container rounded-xl">
        <table class="responsive-table w-full text-gray-200 text-xs" id="interactiveTable">
          <thead class="bg-[rgba(255,255,255,0.04)] text-[var(--accent-blue)] uppercase tracking-wide">
            <tr>
              ${headers}
              <th class="px-2 py-1 border-b border-[rgba(255,255,255,0.1)] text-xs uppercase tracking-wide text-[var(--accent-blue)] actions-head">Actions</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            ${rowsHtml}
          </tbody>
        </table>
      </div>
      ${limitedNote}
       `;
     }

     function activateTableInteractions(limitedData, keys, kind) {
       setTimeout(() => {
         const tbody = document.getElementById("tableBody");
         const searchInput = document.getElementById("tableSearch");
         const headerEls = document.querySelectorAll("#interactiveTable th[data-key]");
         const sortState = {};
         const collapseToggle = document.getElementById('tableCollapseToggle');

         const applyCollapseState = () => {
           if (!collapseToggle) return;
           const expanded = collapseToggle.dataset.state === 'expanded';
           const columns = (collapseToggle.dataset.columns || '').split(',').filter(Boolean);
           columns.forEach(col => applyCollapseToColumn(col, expanded));
         };

         headerEls.forEach(th => {
           th.addEventListener("click", () => handleSort(th, limitedData, keys, kind, sortState, tbody, applyCollapseState));
         });

         if (searchInput) {
           searchInput.addEventListener("input", () => {
             const q = searchInput.value.toLowerCase();
             const filtered = limitedData.filter(row =>
               keys.some(k => String(row[k]).toLowerCase().includes(q))
             );
             tbody.innerHTML = buildRows(filtered, keys, kind);
             applyCollapseState();
           });
         }

         if (collapseToggle) {
           collapseToggle.addEventListener('click', () => {
             const shouldExpand = collapseToggle.dataset.state !== 'expanded';
             collapseToggle.dataset.state = shouldExpand ? 'expanded' : 'collapsed';
             collapseToggle.textContent = shouldExpand ? 'Hide ID64' : 'Show ID64';
             applyCollapseState();
           });
           applyCollapseState();
         }
       }, 0);
     }

     function applyCollapseToColumn(column, expanded) {
       document.querySelectorAll(`[data-column="${column}"]`).forEach(el => {
         el.classList.toggle('is-collapsed', !expanded);
       });
     }

     function handleSort(th, limitedData, keys, kind, sortState, tbody, collapseCallback) {
       const key = th.dataset.key;
       if (!key) return;
       sortState[key] = sortState[key] === "asc" ? "desc" : "asc";
       limitedData.sort((a, b) => compareValues(a[key], b[key], sortState[key]));
       tbody.innerHTML = buildRows(limitedData, keys, kind);
       collapseCallback?.();

       const indicators = document.querySelectorAll(".sort-indicator");
       for (const el of indicators) {
         el.textContent = "";
       }
       th.querySelector(".sort-indicator").textContent = sortState[key] === "asc" ? "▲" : "▼";
     }

     function escapeQuotes(str) {
       return String(str)
         .replaceAll('\\', String.raw`\\`)
         .replaceAll('\'', String.raw`\'`);
     }

     function escapeAttr(str) {
       return String(str)
         .replaceAll('&', "&amp;")
         .replaceAll('<', "&lt;")
         .replaceAll('"', "&quot;");
     }

     function escapeHtml(str) {
       return String(str)
         .replaceAll('&', "&amp;")
         .replaceAll('<', "&lt;")
         .replaceAll('>', "&gt;");
     }

     function formatScalarValue(key, value) {
       let v = value;
       if (key === "distance" && typeof v === "number") {
         return v.toFixed(1);
       }
       if (key === "distance_ly" && typeof v === "number") {
         return v.toFixed(1);
       }
       if (key === "distance_from_arrival_ls" && typeof v === "number") {
         return Math.round(v).toLocaleString();
       }
       if (key === "surface_gravity" && typeof v === "number") {
         return v.toFixed(1);
       }
       if ((key === 'type' || key === 'star_type' || key === 'mainstar') && typeof v === 'string') {
         return getShortStarType(v);
       }
       if (typeof v === "boolean") {
         return v ? 'Yes' : 'No';
       }
       return v;
     }

     function renderBodyDetailTable(record) {
       const entries = Object.entries(record ?? {});
       const rows = entries.map(([key, raw], idx) => {
         const labelAttr = escapeAttr(getColumnLabel(key));
         let valueHtml;

         if ((key === 'body_name' || key === 'name') && typeof raw === 'string') {
           valueHtml = `
             <div class="flex items-center gap-2">
               <span class="flex-1">${escapeHtml(raw)}</span>
               <button
                      title="Copy name"
                      class="copy-name-btn opacity-40 hover:opacity-100 transition-all duration-200 p-1 rounded text-[var(--accent-blue)] focus:opacity-100 focus:outline-none focus:ring-2 focus:ring-[var(--accent-blue)] focus:ring-offset-1 focus:ring-offset-gray-800"
                      onclick="copyToClipboard('${escapeQuotes(raw)}', this)"
                 >
                 ${copyIconSvg}
               </button>
             </div>`;
         } else if (raw && typeof raw === 'object') {
           valueHtml = `<pre class="text-[11px] text-gray-200 bg-transparent whitespace-pre-wrap">${escapeHtml(JSON.stringify(raw, null, 2))}</pre>`;
         } else {
           const formatted = formatScalarValue(key, raw);
           const display = (formatted ?? formatted === 0) ? String(formatted) : '—';
           valueHtml = `<span class="text-gray-100">${escapeHtml(display)}</span>`;
         }

         const rowClass = idx % 2 === 0 ? 'bg-[rgba(255,255,255,0.02)]' : '';
         return `
      <tr class="${rowClass}">
        <th class="w-1/3 text-left px-3 py-2 text-[var(--accent-blue)] uppercase tracking-wide text-[11px] align-top">${labelAttr}</th>
        <td class="px-3 py-2 text-xs align-top">${valueHtml}</td>
      </tr>`;
       }).join("");

       return `
      <div class="responsive-table-container rounded-xl">
        <table class="responsive-table w-full text-gray-200 text-xs">
          <tbody>
            ${rows || '<tr><td class="px-3 py-2 text-sm text-gray-400">No data</td></tr>'}
          </tbody>
        </table>
      </div>`;
     }

     function fillNeighborsInput(x, y, z) {
       const neighborsInput = document.getElementById('neighborsInput');
       neighborsInput.value = `${x},${y},${z},20`;

       // Optional: auto-scroll to neighbors section
       activateTab('lookup');
       neighborsInput.scrollIntoView({ behavior: 'smooth' });
       neighborsInput.focus();

       // Optional: show status
       setStatus(`Neighbors input filled: x=${x}, y=${y}, z=${z}, r=20`);
     }
     globalThis.fillNeighborsInput = fillNeighborsInput;

     function buildRows(rows, keys, kind = null) {
       return rows.map((row, i) => {
         const cells = keys.map(k => renderTableCell(row, k, kind)).join("");
         return `
      <tr class="group ${i % 2 === 0 ? 'bg-[rgba(255,255,255,0.02)]' : ''} hover:bg-[rgba(255,255,255,0.08)] transition">
        ${cells}
        <td class="px-2 py-1 border-b border-[rgba(255,255,255,0.08)] table-actions-cell" data-label="Actions">
          ${buildActionsCell(row, kind)}
        </td>
      </tr>
         `;
       }).join("");
     }

     function isCollapsibleColumn(kind, key) {
       if (!kind || !COLLAPSIBLE_COLUMNS[kind]) {
         return false;
       }
       return COLLAPSIBLE_COLUMNS[kind].has(key);
     }

     function renderTableCell(row, key, kind) {
       const labelAttr = escapeAttr(getColumnLabel(key));
       let value = row[key];

       if (key === 'planet_class' && kind === 'bodies') {
         value = formatStarClass(row);
       }

       if (kind === 'bodies' && key === 'body_type') {
         value = getBodyTypeDisplay(row);
       }

       if (key === 'type' && typeof value === 'string') {
         value = getShortStarType(value);
       }

       if (key === "coords" && typeof value === "object" && value !== null) {
         return renderCoordsCell(labelAttr, value);
       }

       value = formatScalarValue(key, value);

       if (shouldRenderCopyCell(key, value, kind)) {
         return renderCopyCell(labelAttr, value, kind, key);
       }

       if (typeof value === "object" && value !== null) {
         value = JSON.stringify(value);
       }

       const classes = ['px-2', 'py-1', 'border-b', 'border-[rgba(255,255,255,0.08)]', 'mono'];
       if (isCollapsibleColumn(kind, key)) {
         classes.push('collapsible-cell', 'is-collapsed');
       }
       return `<td class="${classes.join(' ')}" data-label="${labelAttr}" data-column="${escapeAttr(key)}">${value ?? ""}</td>`;
     }

     function renderCoordsCell(labelAttr, coords) {
       const { x, y, z } = coords;
       const formatted = `${x.toFixed(1)},${y.toFixed(1)},${z.toFixed(1)}`;
       const fullPrecision = `${x},${y},${z}`;
       const fullPrecisionAttr = escapeAttr(fullPrecision);

       return `
      <td
        class="px-2 py-1 border-b border-[rgba(255,255,255,0.08)] font-mono text-xs leading-tight cursor-pointer copy-cell"
        title="x: ${fullPrecision}"
        data-label="${labelAttr}"
        data-copy-value="${fullPrecisionAttr}"
      >
        <div class="flex items-center gap-2">
          <span class="text-gray-300 tabular-nums">${formatted}</span>
          <button
            title="Copy coords"
            class="copy-name-btn opacity-20 group-hover:opacity-100 transition-all duration-200 p-1 rounded text-[var(--accent-blue)] focus:opacity-100 focus:outline-none focus:ring-2 focus:ring-[var(--accent-blue)] focus:ring-offset-1 focus:ring-offset-gray-800"
            onclick="copyToClipboard('${escapeQuotes(fullPrecision)}', this)"
          >
            ${copyIconSvg}
          </button>
        </div>
      </td>
       `;
     }

     function shouldRenderCopyCell(key, value, kind) {
       const isString = typeof value === "string";
       if (!isString) return false;
       if (key === "name" || key === "neutron_name") return true;
       return kind === 'bodies' && key === "body_name";
     }

     function renderCopyCell(labelAttr, value, kind, key) {
       let copyTitle = 'Copy name';
       if (kind === 'bodies' && key === "body_name") {
         copyTitle = 'Copy body name';
       } else if (key === "neutron_name") {
         copyTitle = 'Copy neutron name';
       }
       const attrValue = escapeAttr(value);

       return `
      <td class="px-2 py-1 border-b border-[rgba(255,255,255,0.08)] mono cursor-pointer copy-cell" data-label="${labelAttr}" data-copy-value="${attrValue}">
        <div class="flex items-center gap-2">
          <span class="flex-1">${value}</span>
          <button
            title="${copyTitle}"
            class="copy-name-btn opacity-20 group-hover:opacity-100 transition-all duration-200 p-1 rounded text-[var(--accent-blue)] focus:opacity-100 focus:outline-none focus:ring-2 focus:ring-[var(--accent-blue)] focus:ring-offset-1 focus:ring-offset-gray-800"
            onclick="copyToClipboard('${escapeQuotes(value)}', this)"
          >
            ${copyIconSvg}
          </button>
        </div>
      </td>
       `;
     }

     function getBodyTypeDisplay(row) {
       if (!row || typeof row !== 'object') {
         return '—';
       }
       const fromPlanetClass = typeof row.planet_class === 'string' ? row.planet_class.trim() : '';
       if (fromPlanetClass) {
         return fromPlanetClass;
       }
       const fromBodyType = typeof row.body_type === 'string' ? row.body_type.trim() : '';
       if (fromBodyType) {
         return fromBodyType;
       }
       const fromStarType = typeof row.star_type === 'string' ? row.star_type.trim() : '';
       if (fromStarType) {
         return getHumanReadableStarType(fromStarType);
       }
       const fromType = typeof row.type === 'string' ? row.type.trim() : '';
       if (fromType) {
         return fromType;
       }
       return '—';
     }

     function formatStarClass(row) {
       const starType = row?.star_type;
       if (typeof starType !== 'string' || !starType.trim()) {
         return row.planet_class;
       }
       const trimmed = starType.trim();
       if (!trimmed) {
         return row.planet_class;
       }
       const human = getHumanReadableStarType(trimmed);
       const luminosity = typeof row?.luminosity === 'string' ? row.luminosity.trim() : '';
       return luminosity ? `${human} (${luminosity})` : human;
     }

     function buildActionsCell(row, kind = null) {
       const parts = [];
       const isSystemLookup = kind === 'system-lookup';

       const displayName = (() => {
         if (typeof row.name === "string" && row.name.trim()) {
           return row.name;
         }
         if (typeof row.neutron_name === "string" && row.neutron_name.trim()) {
           return row.neutron_name;
         }
         return null;
       })();

       const rawSystemId = row.system_id64;
       const rawId64 = row.id64;
       const normalizedSystemId = (() => {
         if (rawSystemId !== undefined && rawSystemId !== null) {
           return rawSystemId;
         }
         if ((kind === 'system-lookup' || kind === 'route') && rawId64 !== undefined && rawId64 !== null) {
           return rawId64;
         }
         return null;
       })();
       const hasSystemId = normalizedSystemId !== null;

       if (displayName && !isSystemLookup) {
         parts.push(`
      <button
        title="View system map"
        class="opacity-30 hover:opacity-100 group-hover:opacity-100 focus:opacity-100 transition-all duration-200 p-1 rounded text-[var(--accent-blue)] focus:outline-none focus:ring-2 focus:ring-[var(--accent-blue)] focus:ring-offset-1 focus:ring-offset-gray-800"
        onclick="openSystemMap('${escapeQuotes(displayName)}', this)"
      >
        ${systemMapIconSvg}
      </button>
         `);
       }

       if (row.coords && typeof row.coords === "object") {
         const { x, y, z } = row.coords;
         if ([x, y, z].every(val => typeof val === "number")) {
           if (!isSystemLookup) {
             parts.push(`
      <button
        type="button"
        title="Open galaxy map"
        class="opacity-30 hover:opacity-100 group-hover:opacity-100 focus:opacity-100 transition-all duration-200 p-1 rounded text-[var(--accent-blue)] focus:outline-none focus:ring-2 focus:ring-[var(--accent-blue)] focus:ring-offset-1 focus:ring-offset-gray-800"
        onclick="openCoordsMap('${x}','${y}','${z}')"
      >
        ${galaxyMapIconSvg}
      </button>
             `);
           }
           parts.push(`
      <button
        type="button"
        title="Search neighbors within 20 LY"
        class="opacity-30 hover:opacity-100 group-hover:opacity-100 focus:opacity-100 transition-all duration-200 p-1 rounded text-[var(--accent-blue)] focus:outline-none focus:ring-2 focus:ring-[var(--accent-blue)] focus:ring-offset-1 focus:ring-offset-gray-800"
        onclick="fillNeighborsInput('${x}','${y}','${z}'); submitNeighbors();"
      >
        ${neighborsIconSvg}
      </button>
           `);
         }
       }

       if ((kind === 'bodies' || kind === 'body-detail') &&
           hasSystemId && row.body_id !== undefined) {
         const sysId = escapeQuotes(String(normalizedSystemId));
         const bodyId = escapeQuotes(String(row.body_id));
         parts.push(`
      <button
        type="button"
        title="Fetch full body details"
        class="opacity-30 hover:opacity-100 group-hover:opacity-100 focus:opacity-100 transition-all duration-200 p-1 rounded text-[var(--accent-blue)] focus:outline-none focus:ring-2 focus:ring-[var(--accent-blue)] focus:ring-offset-1 focus:ring-offset-gray-800"
        onclick="fetchBodyDetails('${sysId}','${bodyId}')"
      >
        ${bodyDetailsIconSvg}
         </button>
         `);
       }

       if ((kind === 'bodies' || kind === 'system-lookup') && hasSystemId) {
         const sysForRefresh = escapeQuotes(String(normalizedSystemId));
         parts.push(`
      <button
        type="button"
        title="Refresh system from Spansh"
        class="opacity-30 hover:opacity-100 group-hover:opacity-100 focus:opacity-100 transition-all duration-200 p-1 rounded text-[var(--accent-blue)] focus:outline-none focus:ring-2 focus:ring-[var(--accent-blue)] focus:ring-offset-1 focus:ring-offset-gray-800"
        onclick="refreshSystemFromSpansh('${sysForRefresh}', this)"
      >
        ${spanshRefreshIconSvg}
      </button>
         `);
       }

       if (!parts.length) {
         return `<span class="text-gray-500 text-xs">—</span>`;
       }

       return `<div class="table-actions">${parts.join("")}</div>`;
     }

     function compareValues(a, b, dir) {
       if (typeof a === "string") a = a.toLowerCase();
       if (typeof b === "string") b = b.toLowerCase();
       if (a < b) return dir === "asc" ? -1 : 1;
       if (a > b) return dir === "asc" ? 1 : -1;
       return 0;
     }
    </script>
  </body>
</html>
