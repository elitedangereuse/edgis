sonar.projectKey=elitedangereuse_edgis
sonar.organization=elitedangereuse
sonar.python.coverage.reportPaths=api/coverage.xml
sonar.javascript.lcov.reportPaths=coverage/js/lcov.info

# Exclude CI-generated artifacts and vendored third-party code from analysis.
# coverage/ holds the JS coverage HTML reports produced during the build;
# api/static/ed3d is a vendored 3D rendering library we do not maintain.
sonar.exclusions=coverage/**, api/static/ed3d/**

# Static frontend assets are not unit-tested the way the API is; keep them out
# of the coverage ratio (they remain under bug/quality analysis).
sonar.coverage.exclusions=api/static/**

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=edgis
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
