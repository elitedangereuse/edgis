sonar.projectKey=elitedangereuse_edgis
sonar.organization=elitedangereuse
sonar.python.coverage.reportPaths=api/coverage.xml
sonar.javascript.lcov.reportPaths=coverage/js/lcov.info

# --- Analysis scope ---------------------------------------------------------
# Exclude code we do not own or quality-gate:
#   api/edts         third-party git submodule (bitbucket.org/Esvandiary/edts)
#   api/static/ed3d  vendored 3D rendering library
#   coverage/        CI-generated JS coverage HTML reports
#   .github/         CI workflow configuration (not application code)
sonar.exclusions=api/edts/**, api/static/ed3d/**, coverage/**, .github/**

# Test code: analysed as tests, not as application source.
sonar.tests=api/tests

# --- Coverage scope ---------------------------------------------------------
# Only first-party, unit-tested code counts toward the coverage ratio. The
# vendored submodule, operational feeder scripts and static frontend assets
# are not unit-tested the way the API is.
sonar.coverage.exclusions=api/edts/**, feeders/**, api/static/**
