[package]
name = "edgis_route"
version = "0.1.0"
edition = "2021"
description = "Native range-growth neutron A* kernel for the EDGIS route plotter"

[lib]
name = "edgis_route"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
numpy = "0.22"
kiddo = "4"
ordered-float = "4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
